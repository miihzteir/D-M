/* ---------- Sync: login com Google e tudo compartilhado entre os dois ---------- */
const hoje = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const Sync = (() => {
  let mode = 'local', fdb = null, user = null, quem = store.get('quem', '');
  let state = {planos:{}, vales:{}, pensei:{}, lidas:{}}, stateUnsub = null;
  const SL = [], cols = {};
  const online = () => mode === 'online' && !!user;
  const emitState = () => SL.forEach(f => f(state));
  const ts = () => firebase.firestore.FieldValue.serverTimestamp();
  const loadScript = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
  state = {planos:store.get('planos', {}), vales:store.get('vales', {}), pensei:store.get('pensei', {}), lidas:store.get('lidas', {}), datesEdit:store.get('datesEdit', {}), planosEdit:store.get('planosEdit', {}), cats:store.get('cats', {}), casinha:store.get('casinha', {}), niver:store.get('niver', {})};
  async function whoAmI(){ const local = store.get('quem', ''); try{ const d = await fdb.doc('pessoas/' + user.uid).get(); quem = (d.exists && d.data().quem) || local; }catch(e){ quem = local; } if(quem && !local) store.set('quem', quem); }
  function attachAll(){
    if(!online()) return;
    if(!stateUnsub) stateUnsub = fdb.doc('compartilhado/estado').onSnapshot(d => { const v = d.data() || {}; state = {planos:v.planos || {}, vales:v.vales || {}, pensei:v.pensei || {}, lidas:v.lidas || {}, datesEdit:v.datesEdit || {}, planosEdit:v.planosEdit || {}, cats:v.cats || {}, casinha:v.casinha || {}, niver:v.niver || {}}; emitState(); }, () => {});
    Object.values(cols).forEach(c => c.attach());
  }
  const ready = (async () => {
    if(!FIREBASE.apiKey || PREVIA) return;
    try{
      const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
      await loadScript(base + 'firebase-app-compat.js');
      await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
      firebase.initializeApp(FIREBASE); fdb = firebase.firestore(); mode = 'online';
      try{ await firebase.auth().getRedirectResult(); }catch(e){}
      await new Promise(res => { const off = firebase.auth().onAuthStateChanged(async u => { off(); user = u; if(u){ await whoAmI(); attachAll(); } res(); }); });
    }catch(e){ mode = 'local'; }
  })();
  function col(name){
    if(cols[name]) return cols[name].api;
    const c = cols[name] = {items:store.get('col_' + name, []), L:[], unsub:null};
    const emit = () => c.L.forEach(f => f(c.items));
    const saveLocal = () => { store.set('col_' + name, c.items); emit(); };
    c.attach = () => {
      if(!online() || c.unsub || !c.L.length) return;
      c.unsub = fdb.collection(name).onSnapshot(snap => {
        c.items = snap.docs.map(d => ({id:d.id, ...d.data(), criadoEm: d.data().criadoEm?.toMillis?.() ?? Date.now()})).sort((a,b) => a.criadoEm - b.criadoEm); emit();
      }, () => {});
    };
    c.api = {
      on(f){ c.L.push(f); f(c.items); ready.then(c.attach); return () => { c.L = c.L.filter(x => x !== f); }; },
      async add(o){ await ready; if(online()) return fdb.collection(name).add({...o, uid:user.uid, criadoEm:ts()});
        c.items = [...c.items, {...o, id:'l' + Date.now() + Math.random().toString(36).slice(2,6), criadoEm:Date.now()}]; saveLocal(); },
      async set(id, o){ await ready; if(online()) return fdb.collection(name).doc(id).set({...o, uid:user.uid, criadoEm:ts()}, {merge:true});
        c.items = [...c.items.filter(x => x.id !== id), {...o, id, criadoEm:Date.now()}]; saveLocal(); },
      async remove(id){ await ready; if(online()) return fdb.collection(name).doc(id).delete();
        c.items = c.items.filter(x => x.id !== id); saveLocal(); }
    };
    return c.api;
  }
  return {
    ready, col,
    get mode(){ return mode; }, get user(){ return user; }, get quem(){ return quem; }, get online(){ return online(); },
    async login(){
      await ready; if(mode !== 'online') return 'offline';
      const prov = new firebase.auth.GoogleAuthProvider();
      try{ user = (await firebase.auth().signInWithPopup(prov)).user; }
      catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)){ await firebase.auth().signInWithRedirect(prov); return 'redirect'; }
        throw e;
      }
      await whoAmI(); attachAll(); return 'ok';
    },
    async setQuem(q){
      quem = q; store.set('quem', q);
      if(online()) await fdb.doc('pessoas/' + user.uid).set({quem:q, email:user.email || ''}, {merge:true});
    },
    on(k, f){ if(k === 'cartas') return col('cartasFilhos').on(f); SL.push(f); f(state); return () => { const i = SL.indexOf(f); if(i > -1) SL.splice(i, 1); }; },
    async setFlag(group, key, val){
      await ready;
      if(online()) return fdb.doc('compartilhado/estado').set({[group]:{[key]:val}}, {merge:true});
      state = {...state, [group]:{...state[group], [key]:val}}; store.set(group, state[group]); emitState();
    },
    async clearGroup(group){
      await ready;
      if(online()) return fdb.doc('compartilhado/estado').set({[group]:firebase.firestore.FieldValue.delete()}, {merge:true});
      state = {...state, [group]:{}}; store.set(group, {}); emitState();
    },
    async clearCol(name){
      await ready; const c = col(name);
      if(online()){ const snap = await fdb.collection(name).get(); let b = fdb.batch(), n = 0;
        for(const d of snap.docs){ b.delete(d.ref); if(++n % 400 === 0){ await b.commit(); b = fdb.batch(); } }
        await b.commit(); return; }
      cols[name].items = []; store.set('col_' + name, []); cols[name].L.forEach(f => f([]));
    },
    async pensei(){
      await ready; const d = hoje(), q = quem || 'Di';
      if(online()) return fdb.doc('compartilhado/estado').set({pensei:{[d]:{[q]:firebase.firestore.FieldValue.increment(1)}}}, {merge:true});
      const day = {...(state.pensei[d] || {})}; day[q] = (day[q] || 0) + 1;
      state = {...state, pensei:{...state.pensei, [d]:day}}; store.set('pensei', state.pensei); emitState();
    },
    addCarta(c){ return col('cartasFilhos').add(c); },
    removeCarta(id){ return col('cartasFilhos').remove(id); }
  };
})();

function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase()}
function parseDate(s){
  const m = s.trim().match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{2}|\d{4})$/) || s.trim().match(/^(\d{2})(\d{2})(\d{4})$/);
  if(!m) return null; let [, d, mo, y] = m; if(y.length===2) y = '20'+y; return `${+d}-${+mo}-${+y}`;
}
const sameDate = (a,b) => parseDate(a) === parseDate(b);

function renderStep(i){
  const s = steps[i]; let wrong = 0;
  app.innerHTML = `
    <div class="gate page"><div class="sheet" id="card">
      <div class="wax wax-pic"><img src="${APP_ICON}" alt="D&amp;M"></div>

      <h1 class="q st" style="--i:2">${s.q}</h1>
      <p class="lead st" style="--i:3">${s.hint}</p>
      ${s.type === 'date' ? `
      <div class="st" style="--i:4">
        <div class="hearts" id="hearts" aria-live="polite">${[0,1,2,3,4,5,6,7].map(k => `${k===2||k===4?'<span class="sep">/</span>':''}<svg viewBox="0 0 24 22" data-h="${k}"><path d="M12 21s-9-5.6-9-12a5 5 0 019-3 5 5 0 019 3c0 6.4-9 12-9 12z"/></svg>`).join('')}</div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n => n === '' ? '<span class="key blank"></span>' : `<button class="key" type="button" data-k="${n}">${n}</button>`).join('')}</div>
        <p class="msg" id="msg" role="status"></p>
      </div>` : `
      <form id="f" autocomplete="off" class="st" style="--i:4">
        <input type="text" id="ans" autocapitalize="words" placeholder="${s.ph}" aria-label="${esc(s.q)}">
        <button type="submit">Continuar</button>
        <p class="msg" id="msg" role="status"></p>
      </form>`}
    </div></div>`;
  const card = document.getElementById('card'), msg = document.getElementById('msg');
  const fail = () => { msg.textContent = s.wrong[wrong++ % s.wrong.length]; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  const pass = el => { sparkle(el); setTimeout(() => i+1 < steps.length ? renderStep(i+1) : renderSuccess(), 450); };
  if(s.type === 'date'){
    let dig = '';
    const paint = () => document.querySelectorAll('#hearts svg').forEach((h,k) => h.classList.toggle('on', k < dig.length));
    const press = k => {
      if(k === '⌫'){ dig = dig.slice(0,-1); paint(); return; }
      if(dig.length >= 8) return;
      dig += k; paint(); msg.textContent = '';
      if(dig.length === 8){
        const v = dig.slice(0,2) + '/' + dig.slice(2,4) + '/' + dig.slice(4);
        setTimeout(() => { if(s.check(v)) pass(document.getElementById('hearts')); else { fail(); dig = ''; setTimeout(paint, 300); } }, 250);
      }
    };
    card.querySelectorAll('.key[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    const onKey = e => { if(!document.getElementById('hearts')){ removeEventListener('keydown', onKey); return; } if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('⌫'); };
    addEventListener('keydown', onKey);
    return;
  }
  const input = document.getElementById('ans');
  setTimeout(() => input.focus(), 500);
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    if(s.check(input.value)) pass(input); else { fail(); input.select(); }
  });
}

function diaDoAno(d = new Date()){ return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026,0,1)) / 86400000); }
/* 364 bilhetes: um diferente pra cada dia, sem repetir no ano */
/* a contagem começa no Natal de 2026: dia 1 = 25/12/2026 … dia 364 = 23/12/2027, dia 365 = véspera, dia 366 em diante = encerrado (horário do celular) */
const INICIO_JORNADA = Date.UTC(2026, 11, 25);
function diaJornada(){ const m = location.hash.match(/^#dia(\d+)$/); if(m) return +m[1]; const d = agoraMT(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - INICIO_JORNADA) / 86400000) + 1; }
function itemDoDia(lista, mult){ const n = lista.length; if(!n) return ''; const dj = diaJornada(); if(dj >= 1) return lista[(dj - 1) % n]; return lista[((diaDoAno() * mult) % n + n) % n]; }
function mensagemDoDia(){ const dj = diaJornada(); if(dj < 1){ const n = 1 - dj; return (C.textos.antesInicio || '').replace('{dias}', n === 1 ? '1 dia' : n + ' dias'); } if(dj === 365) return C.textos.vespera; if(dj > 365) return C.textos.fimDiario; return itemDoDia(C.mensagens, 5); }

      <p class="sign">Mihzinha</p></div>`;
    setTimeout(() => w.scrollIntoView({behavior:'smooth', block:'start'}), 900);
  }
  function end(win, why){
    stopGame(); jogou('coracoes');
    const ov = document.getElementById('ov'); ov.hidden = false;
    if(win){ burst(innerWidth/2, innerHeight/2, 70);
      ov.innerHTML = `<h3>Pegou todos!</h3><p class="lead">Olha embaixo tudo o que eu amo em você.</p><button id="start">Jogar de novo</button>`; }
    else ov.innerHTML = `<h3>Perdeu! kkkkk</h3><p class="lead">${why}<br>Você pegou ${caught.length} de ${META}.</p><button id="start">Tentar de novo</button>`;
    document.getElementById('start').onclick = start;
    showCaught(win);
  }
  function loop(t){
    const dt = Math.min(40, t - last); last = t;
    const lvl = caught.length / META;
    const speed = 1 + lvl * 1.8;
    const every = 950 - lvl * 520;
    spawn -= dt;
    if(spawn <= 0){
      let bad = Math.random() < .14 + lvl * .14;
      if(!bad && !pool.length) bad = true;
      const it = {x:0, y:-30, v:(.11+Math.random()*.06)*speed, bad, w:Math.random()*6};
      if(!bad){ it.word = pool.shift(); x.font = FONT; it.r = Math.max(28, x.measureText(splitWord(it.word)[1]).width * .62 + 10); }
      else it.r = 18;
      it.x = it.r + 8 + Math.random()*(W - 2*it.r - 16);
      items.push(it);
      spawn = every * (.7 + Math.random()*.6);
    }
    let sx = 0; if(shakeT > 0){ shakeT -= dt; sx = (Math.random()-.5)*8; }
    x.clearRect(0,0,W,H); x.save(); x.translate(sx, 0);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    drawCatcher(px, H-30);
    for(const it of items){
      it.y += it.v*dt; it.w += dt*.004;
      const ix = it.x + Math.sin(it.w)*5;
      if(it.bad) drawBroken(ix, it.y, it.r); else drawHeart(ix, it.y, it.r, it.word);
      const reach = 26 + it.r*.6;
      if(!it.hit && it.y + it.r*.6 > H-62 && it.y - it.r*.6 < H-12 && Math.abs(ix - px) < reach){
        it.hit = true;
        if(it.bad){ x.restore(); end(false, 'Pegou um coração partido.'); return; }
        caught.push(it.word); pops.push({x:ix, y:it.y, t:0, txt:'+ ' + it.word, c:'#c93a52'}); hud();
        if(caught.length >= META){ x.restore(); end(true); return; }
      }
      if(!it.hit && it.y - it.r > H){
        it.hit = true;
        if(!it.bad){ pool.push(it.word); lives--; shakeT = 250; pops.push({x:ix, y:H-24, t:0, txt:'−1 ♥︎', c:'#8e1730'}); hud();
          if(lives <= 0){ x.restore(); end(false, 'Deixou cair 5 corações.'); return; } }
      }
    }
    for(const p of pops){ p.t += dt; x.globalAlpha = Math.max(0, 1 - p.t/700); x.font = '600 16px Jost, system-ui'; x.fillStyle = p.c; x.fillText(p.txt, p.x, p.y - p.t*.06); }
    x.globalAlpha = 1; x.fillStyle = '#000'; pops = pops.filter(p => p.t < 700);
    items = items.filter(it => !it.hit);
    x.restore();
    gameRAF = requestAnimationFrame(loop);
  }
};

/* encolhe a foto até caber com folga no banco (cada documento aguenta no máximo 1 MB) */
const FOTO_MAX = 600000;
function desenhaFoto(src, w, h, max, q){ let k = Math.min(1, max / Math.max(w, h)), out = '', qq = q;
  for(let i = 0; i < 7; i++){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', qq); if(out.length <= FOTO_MAX) return out; k *= .8; qq = Math.max(.5, qq - .06); }
  return out; }
function compressImage(file, max = 1000, q = .72){
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    const segue = async (src, w, h) => { try{ const c = await ajustarFoto(src, w, h); ok(desenhaFoto(c, c.width, c.height, max, q)); }catch(e){ no(e); } };
    img.onload = () => { URL.revokeObjectURL(url); segue(img, img.naturalWidth || img.width, img.naturalHeight || img.height); };
    img.onerror = async () => { URL.revokeObjectURL(url);
      try{ const bmp = await createImageBitmap(file); segue(bmp, bmp.width, bmp.height); }
      catch(e){ const er = new Error('formato'); er.code = 'formato'; no(er); } };
    img.src = url;
  });
}
/* ajustar a foto antes de salvar: recortar, dar zoom, posicionar e girar */
function ajustarFoto(src0, w0, h0){
  return new Promise((ok, no) => {
    const LIM = 2400, k0 = Math.min(1, LIM / Math.max(w0, h0));
    let base = document.createElement('canvas'); base.width = Math.round(w0 * k0); base.height = Math.round(h0 * k0); base.getContext('2d').drawImage(src0, 0, 0, base.width, base.height);
    const wrap = document.createElement('div'); wrap.className = 'cr-wrap';
    const RAT = [['orig','Original'],['1','Quadrada'],['0.8','Retrato'],['1.333','Paisagem']];
    wrap.innerHTML = `<div class="cr-box"><p class="cr-tit">Ajustar a foto</p>
      <div class="cr-stage" id="crst"><canvas id="crcv"></canvas></div>
      <div class="cr-rat">${RAT.map(([v, t]) => `<button type="button" data-r="${v}" class="${v === 'orig' ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div class="cr-zoom"><span>−</span><input type="range" id="crz" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span>+</span></div>
      <small class="cr-dica">arrasta pra posicionar · pinça ou usa a barrinha pro zoom</small>
      <div class="cr-acts"><button type="button" class="ghost" id="crgir">↻ Girar</button><button type="button" class="ghost" id="crcan">Cancelar</button><button type="button" id="crok">Pronto</button></div></div>`;
    document.body.append(wrap); document.body.classList.add('cr-aberto');
    const cv = wrap.querySelector('#crcv'), st = wrap.querySelector('#crst'), z = wrap.querySelector('#crz'), x = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
    const S = Math.min(340, innerWidth - 56), PAD = 14;
    cv.width = S * dpr; cv.height = S * dpr; cv.style.width = cv.style.height = S + 'px';
    let ratio = 'orig', fw, fh, fx, fy, s, ox, oy, zoom = 1;
    const quadro = () => { const a = ratio === 'orig' ? base.width / base.height : +ratio, m = S - PAD * 2;
      if(a >= 1){ fw = m; fh = m / a; } else { fh = m; fw = m * a; } fx = (S - fw) / 2; fy = (S - fh) / 2; };
    const prende = () => { const iw = base.width * s, ih = base.height * s; ox = Math.min(fx, Math.max(fx + fw - iw, ox)); oy = Math.min(fy, Math.max(fy + fh - ih, oy)); };
    const escala = (nz, cx = fx + fw / 2, cy = fy + fh / 2) => { const b = Math.max(fw / base.width, fh / base.height), ns = b * nz;
      if(s){ ox = cx - (cx - ox) * ns / s; oy = cy - (cy - oy) * ns / s; } else { ox = fx + (fw - base.width * ns) / 2; oy = fy + (fh - base.height * ns) / 2; }
      s = ns; zoom = nz; z.value = nz; prende(); desenha(); };
    const desenha = () => { x.setTransform(dpr, 0, 0, dpr, 0, 0); x.fillStyle = '#2b2226'; x.fillRect(0, 0, S, S);
      x.drawImage(base, ox, oy, base.width * s, base.height * s);
      x.fillStyle = 'rgba(30,18,22,.55)'; x.beginPath(); x.rect(0, 0, S, S); x.rect(fx, fy, fw, fh); x.fill('evenodd');
      x.strokeStyle = '#fff'; x.lineWidth = 2; x.strokeRect(fx, fy, fw, fh);
      x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1; x.beginPath();
      for(let i = 1; i < 3; i++){ x.moveTo(fx + fw * i / 3, fy); x.lineTo(fx + fw * i / 3, fy + fh); x.moveTo(fx, fy + fh * i / 3); x.lineTo(fx + fw, fy + fh * i / 3); } x.stroke(); };
    const reinicia = () => { quadro(); s = 0; escala(1); };
    reinicia();
    const pts = new Map(); let ini = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, pos(e)); ini = null; e.preventDefault(); });
    cv.addEventListener('pointermove', e => { if(!pts.has(e.pointerId)) return; const p = pos(e), a = pts.get(e.pointerId);
      if(pts.size === 1){ ox += p.x - a.x; oy += p.y - a.y; prende(); desenha(); }
      else if(pts.size === 2){ const [o] = [...pts.entries()].filter(([id]) => id !== e.pointerId).map(([, v]) => v); const d = Math.hypot(p.x - o.x, p.y - o.y);
        if(!ini) ini = {d, z:zoom}; else escala(Math.min(4, Math.max(1, ini.z * d / ini.d)), (p.x + o.x) / 2, (p.y + o.y) / 2); }
      pts.set(e.pointerId, p); e.preventDefault(); });
    const solta = e => { pts.delete(e.pointerId); ini = null; };
    cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);
    cv.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); escala(Math.min(4, Math.max(1, zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08))), p.x, p.y); }, {passive:false});
    z.oninput = () => escala(+z.value);
    wrap.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ratio = b.dataset.r; wrap.querySelectorAll('[data-r]').forEach(o => o.classList.toggle('on', o === b)); reinicia(); });
    const fecha = () => { wrap.remove(); document.body.classList.remove('cr-aberto'); };
    wrap.querySelector('#crgir').onclick = () => { const c = document.createElement('canvas'); c.width = base.height; c.height = base.width; const g = c.getContext('2d');
      g.translate(c.width, 0); g.rotate(Math.PI / 2); g.drawImage(base, 0, 0); base = c; reinicia(); };
    wrap.querySelector('#crcan').onclick = () => { fecha(); const e = new Error('cancel'); e.code = 'cancel'; no(e); };
    wrap.querySelector('#crok').onclick = () => {
      const sx = (fx - ox) / s, sy = (fy - oy) / s, sw = fw / s, sh = fh / s, c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw)); c.height = Math.max(1, Math.round(sh)); c.getContext('2d').drawImage(base, sx, sy, sw, sh, 0, 0, c.width, c.height);
      fecha(); ok(c); };
  });
}
/* explica em português o que deu errado ao salvar */
function erroFoto(e){
  const c = (e && (e.code || e.message)) || '';
  if(/cancel/.test(c)) return 'Foto não trocada.';
  if(/formato/.test(c)) return 'Esse formato de foto não abriu aqui. Tira um print dela e manda o print.';
  if(/permission|insufficient/i.test(c)) return 'O banco não deixou salvar (permissão). Me manda essa mensagem que eu te ajudo a liberar.';
  if(/unauthenticated/i.test(c) || (Sync.mode === 'online' && !Sync.user)) return 'Você não tá logada com o Google, por isso não salvou. Sai do app e entra de novo.';
  if(/too large|exceeds|maximum|size/i.test(c)) return 'A foto ficou grande demais. Tenta outra ou um print dela.';
  if(/unavailable|network|offline|tempo/i.test(c)) return 'Sem internet agora. Tenta de novo quando a conexão voltar.';
  return 'Não deu pra salvar (' + String(c).slice(0, 60) + '). Tenta de novo.';
}

    cap.addEventListener('change', () => { const f = list.find(x => x.id === docId(i)); col.set(docId(i), {mem:id, slot:i, img:(f && f.img) || '', legenda:cap.value.trim(), autor:eu}); });
  });
  file.onchange = async () => {
    const fl = file.files[0]; if(!fl || cur === null) return;
    const note = document.getElementById('mnote'); note.textContent = 'Guardando a foto…';
    try{ const img = await compressImage(fl, 1000, .72); const f = list.find(x => x.id === docId(cur));
      await comTempo(col.set(docId(cur), {mem:id, slot:cur, img, legenda:(f && f.legenda) || '', autor:eu})); note.textContent = 'Foto guardada ♥︎'; sparkle(document.querySelector(`.mslot[data-s="${cur}"]`)); }
    catch(e){ note.textContent = erroFoto(e); }
  };
  const off = col.on(l => { list = l.filter(x => x.mem === id); draw(); });
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); prev(); };
};

const INICIO_STR = '2026-12-25';
const jaComecou = () => diaJornada() >= 1;
const faltamInicio = () => Math.max(0, 1 - diaJornada());
/* chocolates de antes do dia 25 (testes) não contam */
const valeChoco = c => location.hash.startsWith('#dia') || !(m => m && m[1] < INICIO_STR)(String(c.id).match(/(\d{4}-\d\d-\d\d)/));
const chocoInfinito = () => PREVIA;
function chocoSaldo(chocs, compras){
  if(chocoInfinito()) return 99999;
  chocs = chocs.filter(valeChoco);
  const ganhos = chocs.reduce((t,c) => t + (+c.qtd || 1), 0);
  const gastos = compras.reduce((t,c) => t + (+c.preco || 0), 0);
  return Math.max(0, ganhos - gastos);
}
/* ofensiva: dias seguidos que a pessoa entrou e pegou o chocolate */
function ofensiva(chocs, quem){
  const dias = diasDeChoco(chocs, quem);
  const ds = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const d = new Date(); if(!dias.has(ds(d))) d.setDate(d.getDate() - 1);
  let n = 0; while(dias.has(ds(d))){ n++; d.setDate(d.getDate() - 1); }
  return {seguidos:n, total:dias.size, hoje:dias.has(hoje())};
}
function diasDeChoco(chocs, quem){ return new Set(chocs.filter(c => c.id.endsWith('_' + quem) && /^\d{4}-\d\d-\d\d_/.test(c.id) && valeChoco(c)).map(c => c.id.slice(0, 10))); }
function maiorSeq(dias){ const l = [...dias].sort(); let best = 0, cur = 0, prev = null; for(const d of l){ cur = prev && (new Date(d + 'T12:00:00') - new Date(prev + 'T12:00:00')) / 86400000 === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; } return best; }
async function pegarChocolate(col, chocs, eu){
  await col.set(`${hoje()}_${eu}`, {qtd:1, autor:eu, dia:hoje()});
  const of = ofensiva([...chocs, {id:`${hoje()}_${eu}`}], eu);
  if(of.seguidos && of.seguidos % 7 === 0) await col.set(`ofensiva_${hoje()}_${eu}`, {qtd:CASA.bonusOfensiva, autor:eu});
  return of;
}

/* aviso do chocolate do dia na tela inicial */
function chocoDoDia(){
  if(!jaComecou()) return;
  const eu = Sync.quem || 'Di', col = Sync.col('chocolates');
  let list = [];
  const off = col.on(l => { list = l; });
  setTimeout(() => { off();
    if(list.some(c => c.id === `${hoje()}_${eu}`) || !document.querySelector('.home') || document.querySelector('.tk-wrap')) return;
    const of = ofensiva(list, eu);
    document.getElementById('chtoast')?.remove();
    const t = document.createElement('div'); t.id = 'chtoast'; t.className = 'chtoast';
    t.innerHTML = `<span class="ch-ic">${CHOCO_SVG}</span><span class="ch-tx"><b>Seu chocolate de hoje chegou!</b><small>${of.seguidos ? `Pega pra manter a ofensiva de ${of.seguidos} ${of.seguidos === 1 ? 'dia' : 'dias'}` : 'Junta e monta a nossa casinha'}</small></span><button type="button" id="chget">Pegar</button>`;
    t.insertAdjacentHTML('beforeend', `<button type="button" class="ch-x" aria-label="Fechar">${icon('plus')}</button>`);

function progressoMissoes(eu, d){
  const ini = inicioSemana(), iniS = dsStr(ini), outro = eu === 'Di' ? 'Mihzinha' : 'Di';
  const meusDias = new Set(d.chocs.filter(c => /^\d{4}-\d\d-\d\d_/.test(c.id) && c.id.endsWith('_' + eu) && c.id.slice(0,10) >= iniS).map(c => c.id.slice(0,10)));
  const deleDias = new Set(d.chocs.filter(c => /^\d{4}-\d\d-\d\d_/.test(c.id) && c.id.endsWith('_' + outro) && c.id.slice(0,10) >= iniS).map(c => c.id.slice(0,10)));
  const pensei = Object.entries(d.pensei || {}).filter(([k]) => k >= iniS).reduce((t, [, v]) => t + ((v || {})[eu] || 0), 0);
  return {
    resp: d.resp.filter(r => r.quem === eu && r.dia >= iniS).length,
    bilh: d.bilh.filter(b => b.autor === eu && b.criadoEm >= ini.getTime()).length,
    juntos: [...meusDias].filter(x => deleDias.has(x)).length,
    choco: meusDias.size,
    pensei,
    saud: d.saud.filter(x => x.quem === eu && x.dia >= iniS).length
  };
}

  setTimeout(() => { offs.forEach(f => { try{ f(); }catch(e){} });
    try{ Object.keys(localStorage).filter(k => k.startsWith('previa_')).forEach(k => localStorage.removeItem(k));
      const L = (k, v) => localStorage.setItem('previa_' + k, JSON.stringify(v));

      html += `<details class="ed-sec" data-k="${e.k}" ${aberto === e.k ? 'open' : ''}><summary><b>${e.t}</b>${icon('plus')}</summary>${e.d ? `<p class="ed-d">${e.d}</p>` : ''}${corpo}<div class="ed-fim"><button type="button" class="ghost ed-volta">Voltar ao original</button><button type="button" class="ed-salvar">Salvar</button></div></details>`; });
    return html; };
  const ligarEscritas = () => {
    const ler = sec => { const e = ESCRITAS.find(x => x.k === sec.dataset.k);

      if(e.tipo === 'texto' || e.tipo === 'linha') return sec.querySelector('[data-campo]').value.trim();
      return [...sec.querySelectorAll('.ed-obj')].map(ob => { const o = Object.assign({}, e.extra || {}, (getP(C, sec.dataset.k) || [])[+ob.dataset.i] || {}); ob.querySelectorAll('[data-c]').forEach(f => { let v = f.value.trim(); if(f.dataset.k === 'arr') v = v.split('|').map(x => x.trim()).filter(Boolean); if(f.dataset.k === 'idx') v = Math.max(0, (parseInt(v) || 1) - 1); o[f.dataset.c] = v; }); return o; }); };
    $('edb').querySelectorAll('.ed-sec').forEach(sec => {
      sec.addEventListener('toggle', () => { if(sec.open) store.set('edSec', sec.dataset.k); });

      sec.querySelector('.ed-volta').onclick = async e => { const b = e.currentTarget; if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Toca de novo'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Voltar ao original'; }, 2500); return; } await col.remove('tx_' + sec.dataset.k); setTimeout(draw, 250); };
      sec.querySelector('.ed-add')?.addEventListener('click', () => { const e = ESCRITAS.find(x => x.k === sec.dataset.k), v = ler(sec); const n = Object.assign({}, e.extra || {}); e.campos.forEach(([c,,k]) => n[c] = k === 'arr' ? [] : k === 'idx' ? 0 : ''); v.push(n); setP(C, e.k, v); draw(); });
      sec.querySelectorAll('.ed-rm').forEach(bt => bt.onclick = () => { const e = ESCRITAS.find(x => x.k === sec.dataset.k), v = ler(sec); v.splice(+bt.closest('.ed-obj').dataset.i, 1); setP(C, e.k, v); draw(); });
    }); };
  const draw = () => { if(!$('edb')) return;
    document.querySelectorAll('.ed-tabs button').forEach(b => b.classList.toggle('on', b.dataset.a === aba));
    $('edb').innerHTML = aba === 'fotos' ? fotos() : aba === 'cartas' ? cartas() : textos();
    if(aba === 'textos') ligarEscritas();
    $('edb').querySelectorAll('[data-troca]').forEach(b => b.onclick = () => { alvo = b.dataset.troca; $('edfile').value = ''; $('edfile').click(); });
    $('edb').querySelectorAll('[data-tira]').forEach(b => b.onclick = () => { if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Toca de novo'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Excluir'; }, 2500); return; } col.set(b.dataset.tira, {img:''}); });
    $('edb').querySelectorAll('[data-salva]').forEach(b => b.onclick = async () => { const card = b.closest('.ed-card'), o = {}; const l = card.querySelector('[data-leg]'), v = card.querySelector('[data-verso]'); if(l) o.legenda = l.value.trim(); if(v) o.verso = v.value.trim(); await col.set(b.dataset.salva, o); salvo(b); });
    const lerCartas = () => [...$('edb').querySelectorAll('.ed-carta')].map(a => ({titulo:a.querySelector('[data-f=titulo]').value.trim(), abre:a.querySelector('[data-f=abre]').value, quando:a.querySelector('[data-f=quando]').value.trim(), texto:a.querySelector('[data-f=texto]').value.trim()}));
    $('edadd')?.addEventListener('click', () => { const l = lerCartas(); l.push({titulo:'Nova carta', abre:'', quando:'', texto:''}); C.cartas = l.map(c => ({...c, abre:c.abre ? new Date(c.abre + 'T00:00:00') : null})); draw(); const ult = [...$('edb').querySelectorAll('.ed-carta')].pop(); ult && ult.scrollIntoView({behavior:'smooth', block:'center'}); });
    $('edb').querySelectorAll('[data-delc]').forEach(b => b.onclick = () => { if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Toca de novo'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Excluir carta'; }, 2500); return; } const l = lerCartas(); l.splice(+b.dataset.delc, 1); col.set('cartas', {lista:l}).then(() => setTimeout(draw, 200)); });
    $('edsalvac')?.addEventListener('click', async e => { await col.set('cartas', {lista:lerCartas()}); salvo(e.target, 'Cartas salvas!'); });
    $('edsalvat')?.addEventListener('click', async e => { await col.set('textos', {natal:$('txn').value.trim(), segredo:$('txs').value.trim(), retro:$('txr').value.trim(), mes:[...$('edb').querySelectorAll('[data-mes]')].map(t => t.value.trim())}); salvo(e.target, 'Textos salvos!'); });
  };
  $('edfile').onchange = async () => { const f = $('edfile').files[0]; if(!f || !alvo) return; const card = $('edb').querySelector(`[data-slot="${alvo}"] .ed-ph`); if(card) card.innerHTML = '<span><small>preparando…</small></span>';
    if(Sync.mode === 'online' && !Sync.user){ if(card) card.innerHTML = `<span><small>${erroFoto({code:'unauthenticated'})}</small></span>`; return; }
    try{ const img = await compressImage(f, alvo.startsWith('memfoto') ? 520 : 900, .74); if(card) card.innerHTML = '<span><small>salvando…</small></span>'; await comTempo(col.set(alvo, {img})); csToast('Foto salva ♥'); setTimeout(() => draw(), 300); }
    catch(e){ if(e.code === 'cancel'){ draw(); return; } if(card) card.innerHTML = `<span class="ed-err"><small>${erroFoto(e)}</small></span>`; csToast(erroFoto(e)); } };
  document.querySelectorAll('.ed-tabs button').forEach(b => b.onclick = () => { aba = b.dataset.a; store.set('edAba', aba); draw(); });
  ligarViagem($('edvgbox'));
  $('edzerar').onclick = async e => { const b = e.currentTarget, msg = $('rsmsg'), sel = [...document.querySelectorAll('[data-rs]:checked')].map(x => x.dataset.rs);

    delete b.dataset.sure; b.disabled = true; b.textContent = 'Zerando…'; msg.textContent = '';
    try{ for(const id of sel){ const o = RESET_OPC.find(x => x.id === id);
        for(const c of o.cols || []) await Sync.clearCol(c);
        for(const g of o.grupos || []) await Sync.clearGroup(g);
        (o.local || []).forEach(k => store.set(k, k === 'seenBilhetes' || k === 'abracosVistos' ? 0 : {})); }
      const tudo = sel.includes('meuapp');
      b.textContent = 'Pronto!'; sparkle(b); burst(innerWidth / 2, innerHeight / 2, 40);
      msg.textContent = tudo ? 'Zerado! Agora o seu celular vai abrir do começo.' : 'Zerado! Vocês começam do zero juntos.';
      if(tudo) setTimeout(() => { try{ Object.keys(localStorage).filter(k => k.startsWith(PFX) && !/^.*col_conteudo$/.test(k)).forEach(k => localStorage.removeItem(k)); }catch(err){} location.reload(); }, 1600);
      else setTimeout(() => { if(b.isConnected){ b.disabled = false; b.textContent = 'Zerar o que marquei'; } }, 2500);
    }catch(err){ b.disabled = false; b.textContent = 'Zerar o que marquei'; msg.textContent = 'Não deu pra zerar agora. Confere a internet e tenta de novo.'; }
  };
  $('edprevia').onclick = e => { const b = e.currentTarget; if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Toca de novo pra abrir'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Recomeçar como o Di'; }, 3000); return; } entrarPrevia(); };
  const off = col.on(l => { list = l; if(aba !== 'textos' && aba !== 'cartas' || !$('edb').innerHTML) draw(); });
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); prev(); };
  if(foco === 'memjogo') setTimeout(() => document.getElementById('ed-memjogo')?.scrollIntoView({behavior:'smooth', block:'start'}), 400);
  if(foco) setTimeout(() => { const sec = document.querySelector(`.ed-sec[data-k="${foco}"]`); if(sec){ sec.open = true; sec.scrollIntoView({behavior:'smooth', block:'start'}); } }, 350);
  if(origem){ const bk = document.getElementById('back'), pv = bk.onclick; bk.onclick = () => { pv(); setTimeout(() => openStop(origem), 30); }; }
};

/* ---------- coisas que cada um ama: eu coloco as dele, ele coloca as minhas ---------- */
const slugCat = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
let gcatsCol = null;
const gcats = () => { if(gcatsCol && gcatsCol.length) return gcatsCol.filter(c => c.nome).sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0)).map(c => [c.id, c.nome]);
  const l = (C.gostosCats || []).map(t => String(t).trim()).filter(Boolean); return (l.length ? l : ['Outras coisas']).map(t => [slugCat(t), t]); };
const GVELHAS = {jogo:'Jogos', filme:'Filmes e séries', musica:'Músicas', comida:'Comidas', doce:'Doces', lugar:'Lugares', outro:'Outras coisas'};
const nomeCat = id => (gcats().find(c => c[0] === id) || [0, GVELHAS[id] || 'Sem categoria'])[1];
VIEWS.gostos = () => {
  const eu = Sync.quem || 'Di', outro = eu === 'Di' ? 'Mihzinha' : 'Di';
  let aba = store.get('gsAba', outro), filtro = 'tudo', list = [], foto = '';
  const nome = q => q === 'Di' ? 'o Di' : 'a Mihzinha';
  shell('o que cada um ama','O que cada um ama','Você coloca o que o outro ama, com foto e legenda. Assim cada um mostra que presta atenção',
    `<div class="fz-tabs gs-tabs"><button type="button" data-a="Di">O que o Di ama</button><button type="button" data-a="Mihzinha">O que a Mihzinha ama</button></div>
     <div id="gsform"></div><div class="gs-cats" id="gscats"></div><div class="gs-grid" id="gsgrid"></div><input type="file" id="gsfile" accept="image/*" hidden>
     <details class="gs-det gs-catsed" id="gscated"><summary>${icon('pencil')} Mexer nas categorias</summary><div id="gscatbox"></div></details>`);
  const $ = id => document.getElementById(id), col = Sync.col('gostos');
  let formAberto = false, editando = null;
  const form = () => aba === outro ? `<details class="gs-det" id="gsdet" ${formAberto || !list.some(x => x.sobre === outro) ? 'open' : ''}><summary>${icon('plus')} Colocar uma coisa que ${nome(outro)} ama</summary><form class="gs-form" id="gsf">
      <button type="button" class="gs-pick" id="gspick">${foto ? `<img src="${foto}" alt="">` : `<span>${icon('image')}<small>escolher foto</small></span>`}</button>
      <div class="gs-campos"><label class="fz-lab">Categoria<select id="gscat">${gcats().map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></label>
      <label class="fz-lab">Legenda<input type="text" id="gsleg" maxlength="80" placeholder="ex: Minecraft, joga desde criança"></label>
      <button type="submit" id="gssave">Guardar</button><p class="werr" id="gserr"></p></div></form></details>`

  const draw = () => { if(!$('gsgrid')) return;
    document.querySelectorAll('.gs-tabs button').forEach(b => b.classList.toggle('on', b.dataset.a === aba));
    const meus = list.filter(x => x.sobre === aba), ids = [...new Set(meus.map(x => x.cat))], cats = [...gcats().filter(([v]) => ids.includes(v)), ...ids.filter(v => !gcats().some(c => c[0] === v)).map(v => [v, nomeCat(v)])];
    if(filtro !== 'tudo' && !cats.some(([v]) => v === filtro)) filtro = 'tudo';
    $('gscats').innerHTML = meus.length ? [['tudo','Tudo'], ...cats].map(([v, t]) => `<button type="button" class="${filtro === v ? 'on' : ''}" data-f="${v}">${t}</button>`).join('') : '';
    const vis = meus.filter(x => filtro === 'tudo' || x.cat === filtro).slice().reverse();
    $('gsgrid').innerHTML = vis.length ? vis.map(x => `<article class="gs-card">${x.img ? `<img src="${x.img}" alt="">` : `<span class="gs-sem">${icon('star')}</span>`}<div><small>${esc(nomeCat(x.cat))}</small><p>${esc(x.legenda || '')}</p>${x.sobre === outro || x.autor === eu ? `<span class="gs-acts"><button type="button" class="linkbtn" data-ed="${x.id}">editar</button><button type="button" class="linkbtn" data-del="${x.id}">apagar</button></span>` : ''}</div></article>`).join('')
      : `<p class="lead hq-empty">${aba === outro ? `Ainda não tem nada aqui. Coloca a primeira coisa que ${nome(outro)} ama!` : `${eu === 'Di' ? 'A Mihzinha' : 'O Di'} ainda não colocou nada. Logo aparece!`}</p>`;
    $('gscats').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; draw(); });
    $('gsgrid').querySelectorAll('[data-del]').forEach(d => d.onclick = () => { if(d.dataset.sure) col.remove(d.dataset.del); else { d.dataset.sure = 1; d.textContent = 'toca de novo'; } });

  };
  const drawForm = () => { $('gsform').innerHTML = form(); const f = $('gsf'); if(!f) return; $('gsdet').addEventListener('toggle', () => { formAberto = $('gsdet').open; });
    $('gspick').onclick = () => { $('gsfile').value = ''; $('gsfile').click(); };
    f.onsubmit = async e => { e.preventDefault(); const leg = $('gsleg').value.trim(), b = $('gssave');

  };
  $('gsfile').onchange = async () => { const f = $('gsfile').files[0]; if(!f) return; $('gspick').innerHTML = '<span><small>preparando…</small></span>';
    try{ foto = await compressImage(f, 700, .74); $('gspick').innerHTML = `<img src="${foto}" alt="">`; }catch(e){ $('gspick').innerHTML = e.code === 'cancel' ? (foto ? `<img src="${foto}" alt="">` : `<span>${icon('image')}<small>escolher foto</small></span>`) : '<span><small>não deu, tenta outra</small></span>'; } };

  const semear = async () => { if(gcatsCol && gcatsCol.length) return; const base = gcats(); for(let k = 0; k < base.length; k++) await colCat.set(base[k][0], {nome:base[k][1], ordem:k}); };
  const drawCats = () => { const box = $('gscatbox'); if(!box) return; const cs = gcats();

      + `<div class="gs-catrow"><input type="text" size="1" maxlength="30" id="gsnovacat" placeholder="Nova categoria (ex: Séries de anime)"><button type="button" id="gsaddcat">Criar</button></div>`;
    box.querySelectorAll('[data-cid]').forEach(i => i.onchange = async () => { const v = i.value.trim(); if(!v) return; await semear(); const atual = (gcatsCol || []).find(c => c.id === i.dataset.cid) || {}; await colCat.set(i.dataset.cid, {nome:v, ordem:atual.ordem ?? 0}); sparkle(i); });
    box.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => { if(!b.dataset.sure){ b.dataset.sure = 1; b.classList.add('sure'); setTimeout(() => { delete b.dataset.sure; b.classList.remove('sure'); }, 2500); return; } await semear(); await colCat.remove(b.dataset.cdel); });
    $('gsaddcat').onclick = async () => { const v = $('gsnovacat').value.trim(); if(!v) return; await semear(); const ord = Math.max(0, ...((gcatsCol || []).map(c => c.ordem ?? 0))) + 1; await colCat.set('c' + Date.now().toString(36), {nome:v, ordem:ord}); sparkle($('gsaddcat')); };
  };
  const offCat = colCat.on(l => { gcatsCol = l; drawCats(); if(!editando) drawForm(); draw(); });
  let primeira = true;
  const off = col.on(l => { list = l; if(primeira){ primeira = false; drawForm(); } draw(); });
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); offCat(); prev(); };
};

/* cor do envelope combinando com o tema da carta */
function evCor(t, k){
  const x = String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const temas = [[/natal/, 'ev-natal'], [/dormir|noite|sono|insonia/, 'ev-noite'], [/rir|feliz \{ano\}|sorri|alegr|engracad/, 'ev-sol'], [/bravo|brig|raiva|chatead/, 'ev1'],
    [/triste|chor|ruim|dificil/, 'ev2'], [/saudade|longe|falta/, 'ev0'], [/duvid|insegur|medo|ansios/, 'ev5'], [/casamento|casar/, 'ev-perola'], [/noivado|ano novo|\{ano\}|ouro/, 'ev-ouro'],
    [/aniversario|niver/, 'ev4'], [/namorad|namoro|de nos|ano de|anos/, 'ev-amor'], [/cansad|estress|calma/, 'ev3']];
  for(const [r, c] of temas) if(r.test(x)) return c;
  return 'ev' + (k % 6);
}
/* ---------- envelopes (cartas pro futuro) ---------- */
function envelopes(list, seal){
  const now = new Date(), fmt = d => d.toLocaleDateString('pt-BR');
  return `<div class="envlist">${list.map((c,k)=>{
    const locked = c.abre && c.abre > now;
    const sub = c.quando ? c.quando : locked ? `abre em ${fmt(c.abre)} · faltam ${Math.ceil((c.abre-now)/86400000)} dias` : c.abre ? 'já pode abrir' : 'abre quando você precisar';
    return `<button class="envl st ${evCor(c.titulo, k)} ${locked?'locked':''}" style="--i:${k}" data-k="${k}" aria-label="${esc(c.titulo)}">
      <span class="eb"></span><span class="ep"></span><span class="ef"></span><span class="efl"></span><span class="est">${icon('heart')}</span>
      <span class="seal">${locked ? icon('lock') : seal}</span>
      <span class="label">${esc(c.titulo)}<small>${esc(sub)}</small></span></button>
      <div class="slot" id="slot${k}"></div>`;
  }).join('')}</div>`;
}
function wireEnvelopes(list, opener){
  app.querySelectorAll('.envl').forEach(b => b.onclick = () => {
    if(b.classList.contains('locked')){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    const k = +b.dataset.k, slot = document.getElementById('slot'+k);
    if(b.classList.contains('open')){ b.classList.remove('open'); slot.innerHTML = ''; return; }
    b.classList.add('open');
    setTimeout(()=>{ const r = b.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/3, 18); }, 450);
    setTimeout(()=>{ slot.innerHTML = opener(list[k]); slot.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 1000);
  });
}

  shell('pra depois','Cartas pro futuro','Cada uma só abre no dia certo', envelopes(C.cartas, '♥︎'));
  wireEnvelopes(C.cartas, c => `<div class="paper unfold">${quandoEscrita((c.abre || new Date()).getTime())}<p class="to">${esc(c.titulo)}</p><p>${esc(c.texto)}</p><p class="sign">Mihzinha</p></div>`);

  let used = {};

  const paint = () => btns.forEach(b => {

    b.parentElement.classList.toggle('used', !!u);

  });
  const off = Sync.on('state', st => { used = st.vales || {}; paint();
    app.querySelectorAll('.vstatus').forEach(e => { const u = used[e.dataset.s]; e.parentElement.classList.toggle('used', !!u); e.textContent = u ? `resgatado em ${new Date(u.em || Date.now()).toLocaleDateString('pt-BR')}` : 'ainda não resgatado'; const lb = app.querySelector(`[data-lib="${e.dataset.s}"]`); if(lb) lb.hidden = !u; }); });
  btns.forEach(b => b.onclick = async () => {

  closeTicket();
  const v = C.vales[k], info = typeof t === 'object' ? t : {por:'Di', em:Date.now(), cod:'0000'};
  const data = new Date(info.em).toLocaleDateString('pt-BR');

/* ---------- mesversário ---------- */
VIEWS.mes = () => {
  const now = new Date(), ini = C.inicioNamoro, eu = Sync.quem || 'Di', outro = eu === 'Di' ? 'Mihzinha' : 'Di';
  let meses = (now.getFullYear() - ini.getFullYear()) * 12 + (now.getMonth() - ini.getMonth()); if(now.getDate() < 12) meses--;
  const msg = n => C.mesversarios[n - 1] || C.mesversarioPadrao;
  let prox = new Date(now.getFullYear(), now.getMonth(), 12); if(now.getDate() >= 12) prox = new Date(now.getFullYear(), now.getMonth() + 1, 12);
  const faltam = Math.ceil((prox - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  const ehHoje = now.getDate() === 12 && meses > 0;
  const dataMes = n => { const d = new Date(ini.getFullYear(), ini.getMonth() + n, 12); return `12/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
  const alvoPadrao = ehHoje ? meses : meses + 1;
  const opts = Array.from({length: meses + 1}, (_,i) => meses + 1 - i).filter(n => n > 0);
  shell('todo dia 12','Mesversário', ehHoje ? 'Hoje é dia de comemorar!' : `Faltam ${faltam} ${faltam === 1 ? 'dia' : 'dias'} pro próximo`,
    `${ehHoje ? `<div class="paper unfold mesnow">${quandoEscrita(Date.now())}<p class="to">${meses} ${meses === 1 ? 'mês' : 'meses'} juntos</p><p>${esc(msg(meses))}</p><p class="sign">Mihzinha</p><div class="mes-notes" data-n="${meses}"></div></div>` : ''}
     <form class="card-form mes-form" id="msf">
       <p class="wo-t">Escrever pro dia 12</p>
       <label class="fz-lab">Pra qual mês<select id="msn" aria-label="Mês">${opts.map(n => `<option value="${n}" ${n === alvoPadrao ? 'selected' : ''}>${n} ${n === 1 ? 'mês' : 'meses'} · ${dataMes(n)}${n === meses + 1 ? ' (o próximo)' : ''}</option>`).join('')}</select></label>
       <textarea id="mst" rows="4" maxlength="800" placeholder="Escreve aqui o que esse mês significou pra você…" aria-label="Mensagem"></textarea>
       <p class="mes-hint" id="msh"></p>
       <div class="pl-act"><button class="ghost" type="button" id="msdel" hidden>Apagar</button><button type="submit" id="mss">Guardar</button></div>
       <p class="werr" id="mserr"></p>
     </form>
     <div class="meslist">
       <div class="mesblk"><div class="mesitem next"><b>${meses + 1}</b><span><small>${prox.toLocaleDateString('pt-BR')}</small>${icon('lock')} libera no dia 12</span></div><div class="mes-notes" data-n="${meses + 1}"></div></div>
       ${Array.from({length:Math.max(0, meses)}, (_,i) => meses - i).filter(n => !(ehHoje && n === meses)).map((n,k) => `
       <div class="mesblk st" style="--i:${k}"><div class="mesitem"><b>${n}</b><span><small>${n === 1 ? 'mês' : 'meses'} · ${dataMes(n).slice(0,5)}</small>${esc(msg(n))}</span></div><div class="mes-notes" data-n="${n}"></div></div>`).join('')}
     </div>`);
  const $ = id => document.getElementById(id), col = Sync.col('mesversario');
  let list = [];
  const minha = n => list.find(x => x.id === `m${n}_${eu}`);
  const fillForm = () => { const n = +$('msn').value, m = minha(n); $('mst').value = m ? m.texto : ''; $('msdel').hidden = !m; $('mss').textContent = m ? 'Salvar' : 'Guardar';
    $('msh').textContent = n > meses ? `${outro === 'Di' ? 'O Di' : 'A Mihzinha'} só vai conseguir ler no dia ${dataMes(n)}.` : ''; };
  $('msn').onchange = fillForm;
  function draw(){
    document.querySelectorAll('.mes-notes').forEach(box => {
      const n = +box.dataset.n, liberado = n <= meses;
      box.innerHTML = ['Mihzinha','Di'].map(q => {
        const m = list.find(x => x.id === `m${n}_${q}`); if(!m || !m.texto) return '';
        const nome = q === 'Di' ? 'Di' : 'Mihzinha';
        if(!liberado && q !== eu) return `<div class="mes-note lock">${icon('lock')}<span>${q === 'Di' ? 'O Di' : 'A Mihzinha'} já deixou uma mensagem. Abre no dia 12.</span></div>`;
        return `<div class="mes-note"><p>${esc(m.texto)}</p><p class="by">${q === eu && !liberado ? 'você escreveu · só aparece pro outro no dia 12' : `com amor, ${nome}`}</p></div>`;
      }).join('');
    });
    fillForm();
  }
  $('msf').onsubmit = async e => {
    e.preventDefault(); const n = +$('msn').value, texto = $('mst').value.trim();
    if(!texto){ $('mserr').textContent = 'Escreve alguma coisinha.'; return; }
    const b = $('mss'); b.disabled = true;
    try{ await col.set(`m${n}_${eu}`, {mes:n, autor:eu, texto}); sparkle(b); $('mserr').classList.add('ok'); $('mserr').textContent = 'Guardado com amor';
      setTimeout(() => { $('mserr').textContent = ''; $('mserr').classList.remove('ok'); }, 2500); }
    catch(x){ $('mserr').textContent = 'Não deu pra guardar. Tenta de novo.'; }
    b.disabled = false;
  };
  $('msdel').onclick = e => { const bt = e.currentTarget; if(!bt.dataset.sure){ bt.dataset.sure = 1; bt.textContent = 'Toca de novo'; setTimeout(() => { delete bt.dataset.sure; bt.textContent = 'Apagar'; }, 2500); return; } col.remove(`m${+$('msn').value}_${eu}`); };
  const off = col.on(l => { list = l; draw(); });
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); prev(); };
  if(ehHoje) setTimeout(() => burst(innerWidth/2, innerHeight/3, 50), 500);
};

/* deixa qualquer lista editável: preenche o formulário de cima e salva por cima */
function editavel(form, btn, txtNovo){
  const st = {id:null};
  st.abrir = (id, valores) => { st.id = id; Object.entries(valores).forEach(([k, v]) => { const el = document.getElementById(k); if(el) el.value = v ?? ''; });

/* ---------- abra quando ---------- */
/* cada envelope guarda várias cartas; a cada abertura sai uma que ele ainda não leu */
/* cartas antigas sem autor foram escritas pela Mihzinha */
const autorDe = c => c.exemplo ? 'Mihzinha' : (c.autor || 'Mihzinha');
/* as cartas que "leitor" pode abrir: as que o outro escreveu */
function abraPool(list, cat, leitor){
  const real = list.filter(c => c.cat === cat.id && (!leitor || autorDe(c) !== leitor)).sort((a,b) => a.criadoEm - b.criadoEm);
  if(real.length) return real;
  if(leitor === 'Mihzinha') return [{id:'vazio_' + cat.id, cat:cat.id, texto:'', vazio:true, criadoEm:0}];
  return [{id:'ex_' + cat.id, cat:cat.id, texto:cat.texto, exemplo:true, criadoEm:0}];
}

    const abertas = abertasTodas.filter(c => new Date(lidas[c.id].em || Date.now()).getFullYear() === ano);
    pages = [{type:'cover', n:abertas.length, ano}, ...abertas.map((c,i) => ({type:'letter', c, i:i+1, total:abertas.length})), {type:'end', n:abertas.length}];

  const book = document.getElementById('book');
  book.onclick = e => { const r = book.getBoundingClientRect(); (e.clientX - r.left > r.width * .4) ? next() : prev(); };
  let sx = null;
  book.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
  book.addEventListener('touchend', e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if(Math.abs(dx) > 40){ dx < 0 ? next() : prev(); } });

  const offS = Sync.on('state', st => { lidas = st.lidas || {}; build(); if(!busy) render(); });
  const back = document.getElementById('back'), prv = back.onclick; back.onclick = () => { offA(); offS(); prv(); };

VIEWS.roleta = () => {
  const eu = Sync.quem || 'Di';
  shell('próximo encontro','Roleta do date','Gira e o destino escolhe o nosso próximo programa',
    `<div class="wheelbox"><div class="pointer" aria-hidden="true"></div><canvas id="wh" aria-label="Roleta"></canvas><button class="spin" id="spin">Girar</button></div>
     <div id="wres" aria-live="polite"></div>
     <div class="wopts">
       <p class="wo-t">Ideias de date</p>
       <form class="addopt" id="of"><input type="text" id="ot" maxlength="40" placeholder="Adicionar uma ideia" aria-label="Nova ideia"><button type="submit" aria-label="Adicionar">${icon('plus')}</button></form>
       <ul class="wlist" id="ol"></ul>
     </div>`);
  const cv = document.getElementById('wh'), x = cv.getContext('2d'), col = Sync.col('roleta');
  let opts = [], items = [], extra = [], edits = {}, ang = 0, spinning = false;
  const COLS = ['#7a1424','#efe3d8','#b3122c','#fbf7f0'];
  const TXT  = ['#fbf7f0','#1f1a17','#fbf7f0','#1f1a17'];
  const FONT = '600 12px Montserrat, Poppins, system-ui, sans-serif';
  function lines(t, maxW){
    x.font = FONT;
    if(x.measureText(t).width <= maxW) return [t];
    const w = t.split(' '); let a = '', out = [];
    for(const word of w){ const tryA = a ? a + ' ' + word : word; if(x.measureText(tryA).width <= maxW || !a) a = tryA; else { out.push(a); a = word; } }
    out.push(a);
    if(out.length > 2){ out = [out[0], out.slice(1).join(' ')]; }
    return out.map(l => { if(x.measureText(l).width <= maxW) return l; while(l.length > 1 && x.measureText(l + '…').width > maxW) l = l.slice(0,-1); return l + '…'; });
  }
  function draw(){
    const S = cv.clientWidth, d = devicePixelRatio; if(!S) return; cv.width = cv.height = S*d; x.setTransform(d,0,0,d,0,0);
    const r = S/2, n = Math.max(1, opts.length), seg = Math.PI*2/n;
    x.clearRect(0,0,S,S); x.save(); x.translate(r,r); x.rotate(ang);
    opts.forEach((o,i) => {
      const ci = n % 2 && i === n - 1 && n > 1 ? 1 : i % 4;
      x.beginPath(); x.moveTo(0,0); x.arc(0,0,r-2,i*seg,(i+1)*seg); x.closePath(); x.fillStyle = COLS[ci]; x.fill();
      x.strokeStyle = 'rgba(201,169,106,.55)'; x.lineWidth = 1; x.stroke();
      const mid = i*seg + seg/2, world = ang + mid, flip = Math.cos(world) < 0;
      x.save(); x.rotate(mid);
      x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = TXT[ci]; x.font = FONT;
      let cxp = (r - 2 + 34) / 2 + 4; const maxW = (r - 2) - 34 - 18;
      if(flip){ x.rotate(Math.PI); cxp = -cxp; }
      const ls = lines(o, maxW), lh = 14;
      ls.forEach((l, k) => x.fillText(l, cxp, (k - (ls.length - 1) / 2) * lh));
      x.restore();
    });
    x.restore();
    x.beginPath(); x.arc(r,r,r-2,0,Math.PI*2); x.strokeStyle = '#c9a96a'; x.lineWidth = 3; x.stroke();
    x.beginPath(); x.arc(r,r,34,0,Math.PI*2); x.fillStyle = '#fbf7f0'; x.fill(); x.strokeStyle = '#c9a96a'; x.lineWidth = 1.5; x.stroke();
  }
  function rebuild(){
    items = [
      ...C.dates.map((t,k) => ({key:'d'+k, def:true, texto: edits['d'+k] === undefined ? t : edits['d'+k]})).filter(i => i.texto),
      ...extra.map(e => ({key:e.id, def:false, texto:e.texto}))
    ];
    opts = items.map(i => i.texto); draw();
    const ol = document.getElementById('ol'); if(!ol) return;
    ol.innerHTML = items.map(i => `<li data-k="${esc(i.key)}" data-def="${i.def ? 1 : 0}">
      <input type="text" maxlength="40" value="${esc(i.texto)}" aria-label="Editar ideia">
      <button class="wdel" type="button" aria-label="Excluir ideia">${icon('plus')}</button></li>`).join('');
    ol.querySelectorAll('li').forEach(li => {
      const key = li.dataset.k, def = li.dataset.def === '1', inp = li.querySelector('input');
      const save = () => { const t = inp.value.trim(); const cur = items.find(i => i.key === key); if(!t || !cur || t === cur.texto) { if(!t) inp.value = cur ? cur.texto : ''; return; }
        def ? Sync.setFlag('datesEdit', key, t) : col.set(key, {texto:t, autor:eu}); sparkle(inp); };
      inp.addEventListener('change', save);
      inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
      li.querySelector('.wdel').onclick = () => { if(items.length <= 2) return; def ? Sync.setFlag('datesEdit', key, '') : col.remove(key); };
    });
  }
  const offC = col.on(list => { if(!document.getElementById('wh')) return; extra = list; rebuild(); });
  const offS = Sync.on('state', st => { if(!document.getElementById('wh')) return; edits = st.datesEdit || {}; rebuild(); });
  const off = () => { offC(); offS(); };
  addEventListener('resize', draw);
  document.getElementById('of').onsubmit = async e => { e.preventDefault(); const i = document.getElementById('ot'), t = i.value.trim(); if(!t) return; await col.add({texto:t, autor:eu}); i.value = ''; sparkle(i); };
  document.getElementById('spin').onclick = () => {
    if(spinning) return; spinning = true; document.getElementById('wres').innerHTML = '';
    const n = opts.length, seg = Math.PI*2/n, pick = Math.floor(Math.random()*n);
    // ponteiro no topo (-90°): o centro do segmento escolhido para lá
    const target = -Math.PI/2 - (pick*seg + seg/2);
    const TAU = Math.PI*2, start = ang, delta = ((target - start) % TAU + TAU) % TAU, end = start + TAU*6 + delta;
    const total = end - start, dur = reduce ? 10 : 4200, t0 = performance.now();
    (function step(t){
      const p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1 - p, 4);
      ang = start + total*e; draw();
      if(p < 1) return requestAnimationFrame(step);
      spinning = false; const r = document.getElementById('spin').getBoundingClientRect(); burst(r.left + r.width/2, r.top, 40);
      const txt = `Mihzinha, a roleta escolheu o nosso próximo date: ${opts[pick]}! Quando a gente vai? ♥`;
      document.getElementById('wres').innerHTML = `<div class="qcard center page"><p class="eyebrow">nosso próximo date</p><h3>${esc(opts[pick])}</h3>
        ${eu === 'Mihzinha' ? '' : `<a class="wlink" href="https://wa.me/${C.whatsMihzinha}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${icon('whats')}Combinar com a Mihzinha</a>`}</div>`;
    })(t0);
  };
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); removeEventListener('resize', draw); prev(); };
};

/* ---------- pétalas caindo + explosões ---------- */
const pc = document.getElementById('petals'), pctx = pc.getContext('2d');
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const DPR = Math.min(devicePixelRatio, 2); let PW, PH;
function size(){ PW = pc.width = fx.width = innerWidth*DPR; PH = pc.height = fx.height = innerHeight*DPR; }
size(); addEventListener('resize', size);
const PCOL = ['#b3122c','#d9b3ab','#7a1424','#e7cfc7'];
const petals = Array.from({length:14}, (_,i) => ({x:Math.random(), y:Math.random(), s:Math.random()*.0009+.0004, r:Math.random()*7+6, a:Math.random()*6, va:(Math.random()-.5)*.03, w:Math.random()*7, c:PCOL[i%4], o:Math.random()*.35+.35}));
function petal(c, r){ c.beginPath(); c.moveTo(0,-r); c.bezierCurveTo(r*.9,-r*.6, r*.7,r*.7, 0,r); c.bezierCurveTo(-r*.7,r*.7, -r*.9,-r*.6, 0,-r); c.fill(); }
function heart(c, r){
  c.beginPath(); c.moveTo(0,r*.3);
  c.bezierCurveTo(0,-r*.3,-r,-r*.3,-r,r*.25); c.bezierCurveTo(-r,r*.75,0,r*1.05,0,r*1.4);
  c.bezierCurveTo(0,r*1.05,r,r*.75,r,r*.25); c.bezierCurveTo(r,-r*.3,0,-r*.3,0,r*.3); c.fill();
}
let parts = [];
function burst(x, y, n=40){
  if(reduce) return;
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = Math.random()*6+2;
    parts.push({x:x*DPR, y:y*DPR, vx:Math.cos(a)*v*DPR, vy:(Math.sin(a)*v-3)*DPR, life:1, r:(Math.random()*6+5)*DPR, c:PCOL[i%4], rot:Math.random()*6, heart:Math.random()<.6}); }
}
function sparkle(el){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 14); }
let rolando = 0, fxSujo = false, ultQuadro = 0;
addEventListener('scroll', () => { rolando = performance.now(); }, {passive:true});
function frame(now){
  if(!reduce) requestAnimationFrame(frame);
  if(document.hidden) return;
  const parado = now - rolando > 160;
  if(parado && now - ultQuadro > 33){ ultQuadro = now;
  pctx.clearRect(0,0,PW,PH);
  if(!document.getElementById('xapp')) for(const p of petals){
    p.y += p.s * .7; p.w += .01; if(p.y > 1.05){ p.y = -.05; p.x = Math.random(); }
    pctx.save(); pctx.globalAlpha = .18 + p.o * .35; pctx.fillStyle = p.c;
    pctx.translate((p.x + Math.sin(p.w)*.015)*PW, p.y*PH); heart(pctx, (p.r * .42 + 2) * DPR); pctx.restore();
  } }
  if(!parts.length && !fxSujo) return;
  fctx.clearRect(0,0,PW,PH); fxSujo = parts.length > 0;
  parts = parts.filter(p => p.life > 0);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .25*DPR; p.vx *= .98; p.life -= .016; p.rot += .08;
    fctx.save(); fctx.globalAlpha = Math.max(0,p.life); fctx.fillStyle = p.c; fctx.translate(p.x, p.y); fctx.rotate(p.heart ? 0 : p.rot);
    p.heart ? heart(fctx, p.r*.8) : petal(fctx, p.r); fctx.restore();
  }
}
requestAnimationFrame(frame);

/* ---------- neve só no cartão de Natal ---------- */
let snowRAF;
function heroSnow(){
  cancelAnimationFrame(snowRAF);
  const c = document.getElementById('xsnow'); if(!c) return;
  const x = c.getContext('2d');
  const fit = () => { c.width = c.clientWidth*DPR; c.height = c.clientHeight*DPR; }; fit();
  const fl = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*2+.6, s:Math.random()*.0018+.0007, w:Math.random()*7}));
  (function loop(){
    if(!document.getElementById('xsnow')) return;
    if(c.width !== c.clientWidth*DPR) fit();
    x.clearRect(0,0,c.width,c.height); x.fillStyle = 'rgba(247,239,228,.85)';
    for(const f of fl){ f.y += f.s; f.w += .01; if(f.y > 1.02){ f.y = -.02; f.x = Math.random(); }
      x.beginPath(); x.arc((f.x + Math.sin(f.w)*.01)*c.width, f.y*c.height, f.r*DPR, 0, 7); x.fill(); }
    if(!reduce) snowRAF = requestAnimationFrame(loop);
  })();
}

/* arrastar com o mouse pros lados (PC) */
(function(){
  const rolavel=el=>{for(;el&&el!==document.body;el=el.parentElement){if(el.scrollWidth>el.clientWidth+4){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return el}}return null};
  let alvo=null,x0=0,s0=0,moveu=false;
  document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;if(e.target.closest('input,textarea,select,canvas'))return;const el=rolavel(e.target);if(!el)return;alvo=el;x0=e.clientX;s0=el.scrollLeft;moveu=false},true);
  document.addEventListener('pointermove',e=>{if(!alvo)return;const dx=e.clientX-x0;if(Math.abs(dx)>5){moveu=true;alvo.classList.add('arrastando')}if(moveu){alvo.scrollLeft=s0-dx;e.preventDefault()}},true);
  const fim=()=>{if(alvo)alvo.classList.remove('arrastando');alvo=null;setTimeout(()=>moveu=false,0)};
  document.addEventListener('pointerup',fim,true);document.addEventListener('pointercancel',fim,true);
  document.addEventListener('click',e=>{if(moveu){e.stopPropagation();e.preventDefault();moveu=false}},true);
  document.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;const el=rolavel(e.target);if(!el)return;const max=el.scrollWidth-el.clientWidth;if((e.deltaY>0&&el.scrollLeft<max-1)||(e.deltaY<0&&el.scrollLeft>0)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  document.addEventListener('dragstart',e=>{if(rolavel(e.target))e.preventDefault()});
})();
</script>
