<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D&amp;M">
<meta name="application-name" content="D&amp;M">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>D&amp;M</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 120%27%3E%3Crect width=%27120%27 height=%27120%27 rx=%2722%27 fill=%27%23fff%27/%3E%3Cpath transform=%27translate(30 32) scale(2.5)%27 d=%27M12 21s-9-5.6-9-12a5 5 0 019-3 5 5 0 019 3c0 6.4-9 12-9 12z%27 fill=%27%23b3122c%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=Great+Vibes&family=Dancing+Script:wght@500;600;700&display=swap">
<style>
/* D&M · rosa claro de carta de amor, títulos em Playfair cor de ameixa, filete dourado, corações rosa caindo.
   Inspirado nas referências: bilhete pautado, polaroids com legenda manuscrita, cartões brancos arredondados, teclado de coraçõezinhos. */
:root{
  --bg:#fcf4f6;
  --sage:#eaf0dc;
  --sage-2:#dfe6c6;
  --olive:#6f764b;
  --olive-d:#565c38;
  --plum:#4a1224;
  --ink:#4b3b3d;
  --muted:#9d8f8c;
  --pink:#e0789a;
  --pink-2:#f0bac6;
  --pink-3:#fbe6ea;
  --pink-band:#f6d3d6;
  --stripe:#f3c8ce;
  --gold:#c9a96a;
  --card:#ffffff;
  --line:rgba(74,18,36,.08);
  --shadow:0 14px 30px -20px rgba(111,118,75,.55);
  --rose-fill:linear-gradient(180deg,#f0b0c0,#e48aa3);
  --berry:var(--plum); --rose:var(--pink); --petal:var(--pink-2); --blush:var(--pink-3); --paper:#fffafb; --cream:#fff; --bg-2:#fffafb;
  --x-pine:#173a30; --x-deep:#0e231d; --x-gold:#e7c785; --x-snow:#f7efe4;
  --f-display:"Playfair Display","Lora",Georgia,serif;
  --f-body:"Montserrat","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Great Vibes","TeX Gyre Chorus","Segoe Script",cursive;
  --f-hand:"Dancing Script","TeX Gyre Chorus","Segoe Script",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body,.xapp{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.xapp::-webkit-scrollbar{width:0;height:0;background:transparent}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;
}
[hidden]{display:none!important}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
main{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding-block:24px}

/* animações */
.page{animation:pageIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.st{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{40%{transform:scale(1.15)}}
@keyframes xin{from{opacity:0}to{opacity:1}}
@keyframes xout{to{opacity:0;transform:scale(1.04)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:1}}
@keyframes unfold{from{transform:perspective(800px) rotateX(-60deg);opacity:0}to{transform:none;opacity:1}}
.unfold{transform-origin:top center;animation:unfold .8s cubic-bezier(.2,.8,.2,1) both}

/* tipografia */
h1,h2,h3{font-family:var(--f-display);font-weight:700;color:var(--plum);margin:0;line-height:1.15;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.lead{color:var(--muted);margin:0}
.script{font-family:var(--f-script);font-weight:400}
.gold-line,.stitle::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin:12px auto 0;border-radius:2px}

/* botões */
button{font:600 15px var(--f-body);letter-spacing:.02em;color:#fff;background:var(--olive);border:0;border-radius:999px;padding:14px 22px;cursor:pointer;
  box-shadow:0 10px 20px -12px rgba(86,92,56,.8);transition:transform .2s, box-shadow .2s, background .2s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.6}
.ghost{background:var(--pink-band);color:var(--plum);box-shadow:none}
.linkbtn{background:none;color:var(--pink);box-shadow:none;padding:0;font-size:12px;text-decoration:underline}
.del{position:absolute;top:10px;right:10px;background:var(--pink-3);color:var(--pink);box-shadow:none;font-size:11px;padding:4px 10px}

/* ---------- entrada ---------- */
.gate{width:100%;max-width:400px}
.sheet{position:relative;background:var(--card);border-radius:28px;padding:48px 24px 26px;text-align:center;box-shadow:0 30px 60px -30px rgba(224,120,154,.55);display:flex;flex-direction:column;gap:12px}
.wax{position:absolute;top:-28px;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#f7a8bc,#ec6a8d);color:#fff;font-family:var(--f-script);font-size:28px;box-shadow:0 10px 20px -8px rgba(224,120,154,.8);border:4px solid #fff}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--pink-3)}
.dots i.on{background:var(--pink)}
.q{font-size:clamp(24px,7vw,30px)}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.gate input[type=text]{width:100%;font:600 20px var(--f-body);text-align:center;color:var(--plum);background:var(--pink-3);border:2px solid transparent;border-radius:18px;padding:14px;outline:none}
.gate input[type=text]:focus{border-color:var(--pink-2)}
input::placeholder,textarea::placeholder{color:#c9aab3}
.msg{min-height:22px;margin:0;color:var(--pink);font-family:var(--f-hand);font-size:21px}
/* teclado de coraçõezinhos */
.hearts{display:flex;justify-content:center;align-items:center;gap:4px;margin:4px 0}
.hearts svg{width:22px;height:20px}
.hearts path{fill:#f3d5dd;transition:fill .2s, transform .2s}
.hearts .on path{fill:#de6f98}
.hearts .on{animation:pop .3s}
.hearts .sep{color:#e5c3cc;font-weight:700;margin:0 2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.key{background:#fbe3ec;color:#de6f98;box-shadow:none;font-size:24px;font-weight:600;border-radius:18px;padding:12px 0}
.key:hover{background:#fbd3de}
.key.blank{visibility:hidden}
.drawheart{width:100px;height:90px;margin:0 auto}
.drawheart path{fill:none;stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.5s ease forwards .2s}
.drawheart .fill{fill:var(--pink-2);stroke:none;opacity:0;animation:fillin .6s ease forwards 1.4s}
.yay{font-family:var(--f-script);font-size:clamp(52px,15vw,66px);color:var(--plum);line-height:1;margin:0}
.typed::after{content:"|";animation:blink .8s steps(1) infinite;color:var(--pink)}
@keyframes blink{50%{opacity:0}}
.glogin{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:var(--ink);border:1.5px solid var(--pink-3);box-shadow:none}
.glogin .g{width:20px;height:20px}
.gate .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- mensagem do dia ---------- */
.daily{width:100%;max-width:440px;min-height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.dlogo,.logo{border-radius:50%;display:grid;place-items:center;font-family:var(--f-script);color:var(--pink);background:#fff;box-shadow:var(--shadow);padding:0;border:0}
.dlogo{width:76px;height:76px;font-size:30px}
.daily h1{font-size:clamp(30px,8.5vw,40px)}
.daily h1 em{display:block;font-family:var(--f-script);font-style:normal;font-weight:400;color:var(--pink);font-size:1.4em;line-height:1.1}
.dquote{margin:10px 0 0;width:100%;background:#fff;border-radius:6px;padding:26px 22px 22px;text-align:left;font-family:var(--f-hand);font-size:24px;line-height:36px;color:var(--ink);box-shadow:0 18px 36px -22px rgba(74,18,36,.35);
  background-image:repeating-linear-gradient(transparent 0 35px, rgba(74,18,36,.07) 35px 36px);background-position:0 18px}
.dquote::before{content:"Meu amor,";display:block;color:var(--olive)}
.dsign{font-family:var(--f-script);font-size:30px;color:var(--plum);margin:0}
.daily button{margin-top:10px;padding-inline:34px}

/* ---------- início ---------- */
.home{width:100%;max-width:560px;display:flex;flex-direction:column;gap:22px;padding-block:4px 120px;align-self:start}
.hbar{display:flex;align-items:center;gap:12px;padding-top:6px}
.logo{width:48px;height:48px;font-size:20px}
.logo.tap{animation:pop .3s}
.hhi{display:flex;flex-direction:column;line-height:1.2}
.hhi small{color:var(--muted);font-size:13px}
.hhi b{font-family:var(--f-display);font-size:22px;color:var(--plum)}
.tabbody{display:flex;flex-direction:column;gap:18px}
.stitle{font-family:var(--f-display);font-weight:700;color:var(--plum);font-size:26px;text-align:center;margin:10px 0 2px}
.hero-b{position:relative;overflow:hidden;border-radius:26px;padding:30px 16px 26px;text-align:center;color:var(--plum);
  background:radial-gradient(30px 26px at 12% 30%, rgba(255,255,255,.55), transparent 70%),radial-gradient(44px 40px at 85% 22%, rgba(255,255,255,.45), transparent 70%),
             radial-gradient(36px 32px at 70% 80%, rgba(255,255,255,.4), transparent 70%),radial-gradient(26px 24px at 25% 85%, rgba(255,255,255,.35), transparent 70%),
             linear-gradient(160deg,#f6c3cf,#fbe1e7 60%,#f9d2dc)}
.hero-b::before,.hero-b::after{content:"♥\FE0E";position:absolute;color:rgba(255,255,255,.55);filter:blur(2px);font-size:64px;line-height:1}
.hero-b::before{left:6%;top:8%;transform:rotate(-12deg)}
.hero-b::after{right:5%;bottom:-6%;font-size:90px;transform:rotate(14deg);filter:blur(4px)}
.hb-top{margin:0;font-size:13px;font-weight:700;color:var(--plum)}
.hb-count{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,8vw,34px);color:var(--plum);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hb-sub{margin:8px 0 0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#a96d81;position:relative;z-index:1}
.hb-big{margin:18px 0 0;font-family:var(--f-script);font-size:34px;color:var(--pink);position:relative;z-index:1}
.quote{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border-radius:6px;padding:22px 22px 20px;box-shadow:0 18px 36px -24px rgba(74,18,36,.4);
  background-image:repeating-linear-gradient(transparent 0 33px, rgba(74,18,36,.07) 33px 34px);background-position:0 46px}
.quote:hover{transform:rotate(-.4deg)}
.qlabel{display:block;font-family:var(--f-display);font-weight:700;color:var(--plum);font-size:18px;margin-bottom:6px}
.qtext{display:block;font-family:var(--f-hand);font-size:22px;line-height:34px;color:var(--ink)}
.pensei{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.pbtn{width:52px;height:52px;flex:none;border-radius:50%;padding:0;display:grid;place-items:center;font-size:24px;animation:glow 2.4s ease-in-out infinite}
.pbtn .icn{fill:#fff;stroke:#fff}
.pbtn.beat{animation:beat .5s}
@keyframes beat{30%{transform:scale(1.2)}60%{transform:scale(.95)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,120,154,.35)}50%{box-shadow:0 0 0 10px rgba(224,120,154,0)}}
.ptxt{display:flex;flex-direction:column;min-width:0}
.ptxt > b{font-family:var(--f-display);font-size:18px;color:var(--plum)}
.ptxt span{font-size:13px;color:var(--muted)}
.ptxt span b{color:var(--pink)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{width:100%;display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:20px;padding:14px 16px;text-align:left;box-shadow:0 8px 20px -16px rgba(224,120,154,.6)}
.rico{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px;color:var(--pink);background:var(--pink-3)}
.rtxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.rtxt b{font-weight:700;font-size:16px;color:var(--plum)}
.rtxt small{font-size:13px;color:var(--muted)}
.chev{font-size:18px;color:var(--pink-2);flex:none}
.badge{min-width:22px;height:22px;padding:0 8px;border-radius:999px;background:var(--pink);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.xbanner,.last{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border-radius:20px;padding:14px 16px}
.xbanner{background:var(--x-pine);color:var(--x-snow);box-shadow:0 12px 24px -14px rgba(14,35,29,.7)}
.xbanner .rico{background:rgba(255,255,255,.1);color:var(--x-gold)}
.xbanner .rtxt b{color:#fff}.xbanner small{color:rgba(247,239,228,.7)}
.last{margin-top:4px}
.last .rico{background:rgba(255,255,255,.22);color:#fff}
.last .rtxt b{color:#fff}.last small{color:rgba(255,255,255,.85)}
.timeline{list-style:none;margin:0;background:#fff;border-radius:22px;padding:22px 18px 22px 48px;position:relative;display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow)}
.timeline::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:var(--pink-3)}
.timeline li{position:relative}
.timeline li::before{content:"♥\FE0E";position:absolute;left:-30px;top:0;width:20px;height:20px;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--pink);border-radius:50%;box-shadow:0 0 0 4px #fff}
.timeline time{font-size:12px;letter-spacing:.14em;color:var(--pink);font-weight:700;font-variant-numeric:tabular-nums}
.timeline h3{font-size:19px;margin:2px 0 2px}
.timeline p{margin:0;color:var(--muted);font-size:15px}
.timeline .by{font-size:12px}
.emptyli::before{display:none}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px;background:rgba(255,255,255,.95);border-radius:24px;box-shadow:0 14px 34px -14px rgba(224,120,154,.6);animation:xin .4s ease both;max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;box-shadow:none;color:var(--muted);padding:8px 0;border-radius:18px;font-size:11px;font-weight:700}
.tab .icn{font-size:22px}
.tab.on{color:var(--pink);background:var(--pink-3)}
footer{text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:0;padding-top:10px}
footer .script{font-size:40px;color:var(--plum);line-height:1.1}
.icn{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- telas internas ---------- */
.view{width:100%;max-width:560px;display:flex;flex-direction:column;gap:20px;padding-block:0 48px;align-self:start}
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding:10px max(16px, env(safe-area-inset-left,0px));background:rgba(253,238,241,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.vback{display:inline-flex;align-items:center;gap:2px;background:#fff;color:var(--pink);box-shadow:0 6px 14px -10px rgba(224,120,154,.7);padding:8px 14px 8px 8px;font-size:14px}
.vback .icn{font-size:20px}
.vhead{text-align:center;display:flex;flex-direction:column;gap:8px}
.vhead h2{font-family:var(--f-script);font-weight:400;color:var(--olive);font-size:clamp(44px,13vw,58px);line-height:1}
.vhead p{margin:0 auto;color:var(--muted);max-width:36ch;font-size:15px}

/* cartões genéricos */
.qcard,.card-form,.who,.oldq,.wopts,.capsule,.gift-wrap{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qcard h3{font-size:22px}
.center{text-align:center;align-items:center}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--pink-3);color:var(--plum);box-shadow:none;text-align:left;border-radius:16px;font-weight:600}
.opt.ok{background:#dff1e4;color:#25603a}
.opt.no{background:#ffd7df;color:var(--pink)}
.bar{height:5px;border-radius:99px;background:var(--pink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .5s}
.score{font-family:var(--f-display);font-size:64px;color:var(--plum);margin:0;line-height:1;font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.duo.three button:last-child{grid-column:1/-1}
.reveal{min-height:56px;text-align:center;font-family:var(--f-hand);font-size:24px;color:var(--plum);margin:0}
.write{display:flex;flex-direction:column;gap:10px}
textarea,.card-form input[type=text],.card-form input[type=date],.addopt input[type=text]{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--bg-2);border:1.5px solid var(--pink-3);border-radius:16px;padding:12px 14px;outline:none;resize:vertical}
textarea:focus,.card-form input:focus,.addopt input:focus{border-color:var(--pink-2)}
.werr{margin:0;color:var(--pink);font-size:14px}
.werr:empty{display:none}
.savenote{text-align:center;color:var(--muted);font-size:13px;margin:0}
.empty{text-align:center;grid-column:1/-1}

/* papel de carta pautado */
.paper{width:100%;background:#fff;color:var(--ink);border-radius:6px;padding:26px 22px 22px;font-family:var(--f-hand);font-size:22px;line-height:34px;text-align:left;position:relative;
  box-shadow:0 18px 36px -22px rgba(74,18,36,.4);background-image:repeating-linear-gradient(transparent 0 33px, rgba(74,18,36,.07) 33px 34px);background-position:0 26px}
.paper p{margin:0 0 6px}
.paper .to{color:var(--plum)}
.sign{text-align:right;font-family:var(--f-script);font-size:32px;color:var(--plum);margin:10px 0 0}
.paper.kid{margin-bottom:12px}
.paper.kid .sign small{display:block;font-family:var(--f-body);font-size:12px;line-height:1.4;color:var(--muted)}

/* envelopes */
.envlist{display:flex;flex-direction:column;gap:24px;align-items:center}
.envl{position:relative;width:100%;max-width:330px;aspect-ratio:1.55;background:none;padding:0;border-radius:8px;box-shadow:none;color:var(--ink);transition:margin .5s ease, transform .2s}
.envl.open{margin-top:110px}
.envl > span{position:absolute;display:block}
.envl .eb{inset:0;background:#f9c9d4;border-radius:8px;box-shadow:0 18px 30px -18px rgba(224,120,154,.8)}
.envl .ep{left:7%;right:7%;top:8%;bottom:8%;background:#fff;border-radius:3px;transition:transform .8s cubic-bezier(.3,1.2,.5,1) .35s;background-image:repeating-linear-gradient(transparent 0 12px, rgba(74,18,36,.08) 12px 13px)}
.envl .ef{inset:0;background:#fde0e7;border-radius:8px;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:2}
.envl .efl{left:0;right:0;top:0;height:56%;background:#f6b8c7;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .55s ease, z-index 0s .3s}
.envl .label{left:0;right:0;bottom:11%;z-index:4;text-align:center;font-family:var(--f-hand);font-size:22px;padding:0 12px;line-height:1.15;color:var(--plum);transition:opacity .3s}
.envl .label small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.envl .seal{left:50%;top:56%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;z-index:5;display:grid;place-items:center;background:var(--rose-fill);color:#fff;font-size:17px;box-shadow:0 4px 10px rgba(224,120,154,.5);transition:transform .4s, opacity .4s}
.envl .seal .icn{font-size:17px}
.envl.locked .seal{background:#c9b3ba}
.envl.open .seal{transform:scale(1.6) rotate(25deg);opacity:0}
.envl.open .efl{transform:perspective(600px) rotateX(180deg);z-index:1}
.envl.open .ep{transform:translateY(-38%)}
.envl.open .label{opacity:0}
.slot{width:100%}

/* cartas ao filho */
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 18px}
.who > span{font-family:var(--f-display);font-weight:700;color:var(--plum)}
.seg{display:flex;background:var(--pink-3);border-radius:999px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--pink);box-shadow:none;padding:8px 16px;font-size:15px}
.seg button.on{background:#fff;color:var(--plum);box-shadow:0 4px 10px -6px rgba(224,120,154,.8)}
.moms{display:flex;flex-direction:column;gap:12px}
.mom{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.momhead{width:100%;display:flex;align-items:center;gap:14px;background:none;color:var(--ink);box-shadow:none;border-radius:0;padding:16px;text-align:left}
.momhead .ico{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px;color:var(--pink);background:var(--pink-3)}
.momhead .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.momhead b{font-weight:700;color:var(--plum)}
.momhead small{font-size:13px;color:var(--muted)}
.momhead .count{font-size:12px;color:var(--pink);font-weight:700;margin-top:2px}
.momhead .chev{font-size:22px;color:var(--pink-2);transition:transform .35s}
.mom.open .chev{transform:rotate(90deg)}
.mombody{display:none;padding:2px 14px 16px}
.mom.open .mombody{display:block}
.mom.open .mombody > *{animation:rise .45s both}

/* fotos */
.ph{width:100%;aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-hand);font-size:20px;color:rgba(74,18,36,.45);background:linear-gradient(135deg,#fde3ea,#f7a8bc)}
.ph.b{background:linear-gradient(135deg,#fdf0e4,#f2c8a8)}.ph.c{background:linear-gradient(135deg,#f6e9f5,#d9b6dc)}.ph.d{background:linear-gradient(135deg,#eef3e4,#c9d8b2)}
.polas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px;padding:6px}
.pola{position:relative;perspective:900px;background:none;padding:0;border-radius:0;box-shadow:none;--r:-3deg;transform:rotate(var(--r));animation:drop .8s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i)*120ms + 150ms)}
.pola:nth-child(even){--r:3deg}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(calc(var(--r) * -4))}to{opacity:1;transform:rotate(var(--r))}}
.pola .in{position:relative;transition:transform .8s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.pola.flip .in{transform:rotateY(180deg)}
.pola .face{position:relative;background:#fff;padding:9px 9px 40px;box-shadow:0 14px 26px -14px rgba(74,18,36,.45);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pola .face span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--f-hand);color:var(--plum);font-size:19px}
.pola .backf{position:absolute;inset:0;transform:rotateY(180deg);display:grid;place-items:center;padding:16px;font-family:var(--f-hand);font-size:20px;line-height:1.25;color:var(--plum);text-align:center}
.pola .tape{position:absolute;top:-9px;left:50%;width:58px;height:18px;margin-left:-29px;background:rgba(247,168,188,.6);transform:rotate(-4deg);z-index:2}
.scratch{position:relative;width:100%;max-width:330px;align-self:center;background:#fff;padding:12px 12px 46px;box-shadow:0 18px 32px -16px rgba(74,18,36,.45);transform:rotate(-1.5deg)}
.scratch canvas{position:absolute;left:12px;top:12px;width:calc(100% - 24px);aspect-ratio:1;touch-action:none;cursor:grab}
.scratch p{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;font-family:var(--f-hand);font-size:21px;color:var(--plum)}

/* jogos */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:3/4;padding:0;border-radius:14px;background:none;box-shadow:none;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.mc .f,.mc .k{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mc .f{background:linear-gradient(160deg,#f7a8bc,#ec6a8d);color:#fff;font-size:20px;border:3px solid #fff;box-shadow:0 8px 16px -10px rgba(224,120,154,.9)}
.mc .k{transform:rotateY(180deg);font-size:clamp(26px,8vw,34px);background:#fff;color:var(--pink);border:3px solid var(--pink-3)}
.mc.got .k{border-color:var(--pink)}
.stats{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.game{position:relative;width:100%;aspect-ratio:3/4;max-height:66vh;border-radius:26px;overflow:hidden;background:linear-gradient(#fff,#fde3ea);box-shadow:var(--shadow);touch-action:none}
.game canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700;color:var(--plum);font-variant-numeric:tabular-nums}
.hud i{font-style:normal;color:var(--pink);font-size:18px;margin-right:2px;display:inline-block;transition:opacity .3s}
.hud i.lost{opacity:.2}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(255,255,255,.88);backdrop-filter:blur(3px)}
.overlay h3{font-size:28px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:15px;color:var(--ink)}
.rules b{display:inline-block;width:22px;color:var(--pink)}
.caught .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.chip{font-family:var(--f-body);font-size:14px;font-weight:600;line-height:1.3;color:#fff;background:var(--rose-fill);border-radius:999px;padding:6px 14px;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*60ms + 400ms)}
@keyframes pop2{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.caught .more{font-size:19px;color:var(--muted)}

/* planos e vales */
.plans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plans label{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 8px 20px -16px rgba(224,120,154,.6)}
.plans input{width:22px;height:22px;accent-color:var(--pink);flex:none}
.plans .t{flex:1;min-width:0}
.plans .t b{font-weight:700;color:var(--plum)}
.plans .t small{display:block;color:var(--muted);font-size:13px}
.plans input:checked + .t b{text-decoration:line-through;text-decoration-color:var(--pink);opacity:.6}
.vales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vale{border-radius:22px;padding:18px 12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff;text-align:center;box-shadow:var(--shadow);transition:transform .3s, opacity .3s}
.vale .ico{font-size:28px;color:var(--pink);display:flex;justify-content:center}
.vale b{font-weight:700;color:var(--plum);font-size:15px;line-height:1.25}
.vale button{padding:9px;font-size:14px;margin-top:auto}
.vale.used{opacity:.65}
.vale.used button{background:var(--pink-3);color:var(--pink);box-shadow:none}

/* presente */
.gift-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:60px 18px 26px}
.gift{width:150px;height:150px;position:relative;background:none;padding:0;box-shadow:none}
.gift span{position:absolute;display:block}
.gift .box{left:15px;right:15px;bottom:0;height:96px;background:var(--rose-fill);border-radius:10px}
.gift .lid{left:5px;right:5px;top:30px;height:30px;background:#f7a8bc;border-radius:10px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.gift .rib{left:50%;margin-left:-9px;width:18px;top:30px;bottom:0;background:var(--gold)}
.gift .bow{position:absolute;left:50%;top:6px;margin-left:-30px;width:60px;height:36px;transition:transform .7s}
.gift.open .lid{transform:translateY(-46px) rotate(-16deg)}
.gift.open .bow{transform:translate(-30px,-56px) rotate(-24deg)}
.gift:not(.open){animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}96%{transform:rotate(-2deg)}}

/* ticket e overlays */
.tk-wrap{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(74,18,36,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);animation:xin .3s ease both}
.tk-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.ticket{display:flex;background:#fff;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 30px 60px -20px rgba(74,18,36,.45);animation:print .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-24px)}to{clip-path:inset(0 0 0 0);transform:none}}
.tk-main{flex:1;min-width:0;padding:22px 18px 20px 22px;display:flex;flex-direction:column;gap:6px}
.tk-ico{font-size:28px;color:var(--pink)}
.tk-main h3{font-size:22px}
.tk-who{margin:0;font-size:13px;color:var(--muted)}
.tk-stub{width:92px;flex:none;background:var(--rose-fill);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border-left:2px dashed rgba(255,255,255,.6)}
.tk-stub b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tk-stub span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;text-align:center}
.tk-actions{display:flex;flex-direction:column;gap:10px;animation:rise .5s both .6s}
.tk-actions .ghost{background:#fff}
.tk-note{margin:0;text-align:center;color:#fff;font-size:14px}
.tk-note:empty{display:none}
.wlink,.wbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.wlink{align-self:center;background:#25a464;color:#fff;text-decoration:none;border-radius:999px;padding:12px 20px;font-weight:700}
.wlink .icn,.wbtn .icn{font-size:20px}
.secret .eyebrow{margin-bottom:6px}

/* pergunta, mural, listas */
.ans{background:var(--bg-2);border-radius:16px;padding:12px 16px}
.ans small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700}
.ans p{margin:4px 0 0;font-family:var(--f-hand);font-size:22px;line-height:1.3}
.ans.mine{background:var(--pink-3)}
.locked-ans{display:flex;align-items:center;gap:8px;justify-content:center}
.locked-ans .icn{font-size:16px}
.oldq{margin-bottom:10px;padding:14px 16px}
.oldq small{color:var(--muted);font-size:12px}
.oldq p{margin:6px 0 0}
.gtitle{font-family:var(--f-display);font-weight:700;color:var(--plum);font-size:18px;margin:6px 0 10px;text-align:center}
.mural{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.postit{position:relative;padding:16px 14px 12px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transform:rotate(var(--r));box-shadow:0 12px 20px -14px rgba(74,18,36,.5);animation:rise .5s both}
.postit p{margin:0;font-family:var(--f-hand);font-size:21px;line-height:1.2;word-break:break-word;color:var(--ink)}
.postit small{font-size:11px;color:rgba(74,18,36,.55)}
.postit.c0{background:#ffe1e8}.postit.c1{background:#fff2d9}.postit.c2{background:#f3e3f2}.postit.c3{background:#e7f0de}
.postit .del{top:6px;right:6px;font-size:10px;padding:3px 7px;background:rgba(255,255,255,.6)}
.card-form{display:flex;flex-direction:column;gap:10px}
.by{font-size:12px;color:var(--muted)}
.songs{display:flex;flex-direction:column;gap:10px}
.song{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:20px;padding:14px;box-shadow:0 8px 20px -16px rgba(224,120,154,.6)}
.play{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff;background:var(--rose-fill);text-decoration:none}
.play.off{background:var(--pink-3);color:var(--pink)}
.sinfo{min-width:0;display:flex;flex-direction:column}
.sinfo b{font-weight:700;color:var(--plum)}
.sinfo small{color:var(--muted);font-size:13px}
.sinfo p{margin:6px 0;font-family:var(--f-hand);font-size:20px;line-height:1.25}
.meslist{display:flex;flex-direction:column;gap:10px}
.mesitem{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 8px 20px -16px rgba(224,120,154,.6)}
.mesitem > b{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--rose-fill);color:#fff;font-family:var(--f-display);font-size:20px}
.mesitem span{display:flex;flex-direction:column;min-width:0}
.mesitem small{font-size:12px;color:var(--pink);font-weight:700}
.mesitem.next{background:transparent;box-shadow:none;border:1.5px dashed var(--pink-2);color:var(--muted)}
.mesitem.next > b{background:var(--pink-3);color:var(--pink)}
.mesitem.next .icn{display:inline-block;font-size:14px;vertical-align:-2px}
.capsule{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted)}
.capsule p{margin:0}
.cap-ico{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:40px;color:var(--pink);background:var(--pink-3);animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(180deg)}}
.capsule.opened .cap-ico{animation:none;color:var(--gold)}
.wheelbox{position:relative;width:100%;max-width:330px;align-self:center;aspect-ratio:1}
.wheelbox canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 22px 40px -20px rgba(224,120,154,.8);border:6px solid #fff}
.pointer{position:absolute;top:-8px;left:50%;margin-left:-14px;width:28px;height:30px;background:var(--plum);clip-path:polygon(0 0,100% 0,50% 100%);z-index:2}
.spin{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;padding:0;font-size:14px}
.wopts summary{cursor:pointer;font-weight:700;color:var(--plum)}
.wopts ul{margin:12px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.addopt{display:flex;gap:8px;margin-top:12px}
.addopt button{flex:none;width:48px;padding:0;display:grid;place-items:center;font-size:20px}

/* =================== início em faixas, como as referências =================== */
.home{width:100%;max-width:none;gap:0;padding-block:0 0;align-self:start}
.band{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding:44px max(22px, env(safe-area-inset-left,0px)) 46px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;position:relative}

.b-sage{background:var(--sage)}
.b-pink{background:var(--pink-band)}
.b-stripes{background:repeating-linear-gradient(90deg,#f6d3d6 0 26px,#f3c8ce 26px 52px)}
.b-light{background:var(--bg)}

.btext{margin:0;color:var(--olive-d);font-size:14px;line-height:1.7;max-width:34ch}

.hdate{margin:0;font-size:13px;letter-spacing:.14em;color:var(--olive);text-transform:uppercase}
.flower{position:relative;width:min(250px,72vw);aspect-ratio:1;margin:6px auto 0}

.flower .ribbon{position:absolute;width:44%;top:-14%;left:-8%;transform:rotate(-14deg)}
.hcount{margin:4px 0 0;font-family:var(--f-display);font-weight:600;color:var(--plum);font-size:clamp(18px,5.4vw,24px);font-variant-numeric:tabular-nums;white-space:nowrap}

.daisy{position:absolute;width:46px;height:46px}
.note{background:#fff;border-radius:4px;padding:24px 22px 22px;text-align:left;box-shadow:0 18px 36px -24px rgba(74,18,36,.45);background-image:repeating-linear-gradient(transparent 0 33px, rgba(74,18,36,.07) 33px 34px);background-position:0 54px}

.note-btn{background:none;box-shadow:none;padding:0;width:100%;text-align:inherit;color:inherit}
.wcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wcard{position:relative;background:#fff;color:var(--ink);border-radius:18px;padding:30px 8px 14px;box-shadow:0 10px 20px -16px rgba(74,18,36,.5);display:flex;flex-direction:column;align-items:center;gap:4px}
.wcard .fl-ic{position:absolute;top:-16px;left:50%;margin-left:-16px;width:32px;height:32px}
.wcard b{font-family:var(--f-script);font-weight:400;color:var(--olive);font-size:26px;line-height:1}

.pensei{background:#fff;border-radius:20px;box-shadow:0 10px 20px -16px rgba(74,18,36,.5);text-align:left}
.pbtn{background:var(--rose-fill)}
.pills{display:flex;flex-direction:column;gap:10px}

.pill .pl{background:#f0bac6;color:#fff;border-radius:999px;display:grid;place-items:center;font-size:20px;min-height:46px}
.pill .pr{background:#fff;border-radius:999px;padding:9px 18px;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.b-pink .pill .pr{background:#fdeef0}
.pill .pr b{font-weight:600;font-size:14px;color:var(--plum)}
.pill .pr small{font-size:11px;color:var(--muted)}
.pill .badge{display:none}
.polrow{display:flex;justify-content:center;gap:0;padding:6px 0}
.mini{background:#fff;padding:6px 6px 22px;width:31%;box-shadow:0 10px 18px -12px rgba(74,18,36,.5);border-radius:0;color:var(--plum);font-family:var(--f-hand);font-size:13px;position:relative}
.mini .ph{font-size:12px}
.mini span{position:absolute;left:0;right:0;bottom:3px}
.mini:nth-child(1){transform:rotate(-6deg) translateY(6px)}.mini:nth-child(2){transform:rotate(2deg);z-index:1}.mini:nth-child(3){transform:rotate(7deg) translateY(8px)}
.lastbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;background:var(--rose-fill);color:#fff;font-weight:600}
.lastbtn .icn{font-size:20px}
.xbanner{max-width:520px}
.endband{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.endtitle{font-family:var(--f-script);color:var(--plum);font-size:clamp(46px,13vw,62px);line-height:1;margin:0}
.endsub{margin:0;color:var(--muted);font-size:13px}
.ribbon-sm{width:70px;margin:0 auto}
.timeline{background:#fff;box-shadow:0 10px 20px -16px rgba(74,18,36,.5);text-align:left}
.timeline li::before{background:#f0bac6}
.timeline time{color:var(--olive)}
.timeline h3{font-size:18px}
.hero .xbanner{margin-top:8px}

/* telas internas no tom das referências */
.view{max-width:560px}
.vbar{background:rgba(252,244,246,.9)}
.vback{color:var(--olive)}
.vhead p{color:var(--olive-d)}
.rico,.momhead .ico,.cap-ico{background:var(--sage);color:var(--olive)}
.qcard,.card-form,.who,.oldq,.wopts,.capsule,.gift-wrap,.mom,.vale,.song,.mesitem,.plans label{box-shadow:0 10px 22px -18px rgba(74,18,36,.5)}
.qcard h3,.tk-main h3,.overlay h3{color:var(--plum)}
.vale .ico,.tk-ico{color:var(--olive)}
.opt{background:var(--sage);color:var(--olive-d)}
.opt.ok{background:#d9e8c9;color:#3f5a26}
.opt.no{background:var(--pink-band);color:var(--plum)}
.bar{background:var(--sage)} .bar i{background:var(--olive)}
.seg{background:var(--sage)} .seg button{color:var(--olive)}
.sign{color:var(--plum)}
.score{color:var(--olive)}
.game{background:linear-gradient(#fffafb,var(--pink-band))}
.mc .f{background:linear-gradient(160deg,#dfe6c6,#b9c49a);color:#fff}
.mc .k{color:var(--pink)}
.envl .eb{background:#f3c8ce}.envl .ef{background:#f9dfe3}.envl .efl{background:#efb8c2}
.wlink{background:var(--olive)}
.plans input{accent-color:var(--olive)}
.dquote::before{color:var(--olive)}
.daily h1{color:var(--plum)}
.daily h1 em{color:var(--olive)}
.dlogo{color:var(--olive)}
.wax{background:var(--rose-fill);color:#fff}
.sheet{box-shadow:0 30px 60px -30px rgba(111,118,75,.6)}
.yay{color:var(--olive)}
.q{color:var(--plum)}
.dots i.on{background:var(--olive)}
.gate input[type=text]{background:var(--sage);color:var(--olive-d)}

/* =================== sistema final: medidas consistentes =================== */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:14px; --r2:20px; --r3:28px;
  --w:440px;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:18px; --t-xl:30px;
}
body{font-size:var(--t-md);line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
.lead,.vhead p,.btext{font-size:var(--t-md);line-height:1.6}
small{font-size:var(--t-sm)!important}
.eyebrow{font-size:var(--t-xs);letter-spacing:.18em}

/* títulos: Playfair itálico (legível) no lugar da letra cursiva */
.btitle,.vhead h2{font-family:var(--f-display)!important;font-style:italic;font-weight:600!important;color:var(--olive)!important;font-size:var(--t-xl)!important;line-height:1.15!important;letter-spacing:-.005em}
.btitle::after,.vhead h2::after{content:"";display:block;width:36px;height:2px;background:var(--gold);margin:var(--s3) auto 0;border-radius:2px}
.q{font-size:26px;line-height:1.2}
.qcard h3,.overlay h3,.tk-main h3{font-size:var(--t-lg);line-height:1.3}

/* letra manuscrita mais firme e maior */
.note p,.paper,.qtext,.dquote,.xnote p,.ans p,.postit p,.sinfo p,.reveal,.pola .face span,.pola .backf,.mini,.scratch p,.envl .label,.msg{font-family:var(--f-hand);font-weight:600}
.note p,.paper,.dquote{font-size:21px;line-height:34px}

/* faixas e larguras iguais */
.band{padding:var(--s7) var(--s5);gap:var(--s5)}
.band > *{max-width:var(--w)}
.view{max-width:var(--w);gap:var(--s5)}
.gate{max-width:var(--w)}
.daily{max-width:var(--w)}

/* cartões com o mesmo raio, sombra e respiro */
.note,.qcard,.card-form,.who,.oldq,.wopts,.capsule,.gift-wrap,.pensei,.mom,.song,.mesitem,.plans label,.vale,.xcard,.sheet{border-radius:var(--r2)}
.qcard,.card-form,.who,.oldq,.wopts,.capsule,.pensei,.xcard{padding:var(--s5)}
.note{padding:var(--s5) var(--s5) var(--s4)}
.sheet{border-radius:var(--r3);padding:56px var(--s5) var(--s5);gap:var(--s3)}

/* botões: mesma altura em todo lugar */
button{min-height:48px;font-size:var(--t-md)}
.pill,.note-btn,.mini,.mc,.pola,.envl,.gift,.wcard,.tab,.vback,.linkbtn,.del,.logo,.key,.whobtn,.seg button,.spin,.pbtn,.opt{min-height:0}
.vback{min-height:40px}

/* início */
.hero{padding-top:calc(var(--s5) + env(safe-area-inset-top,0px));gap:var(--s4)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.hero .logo{font-family:var(--f-script);font-size:26px;color:var(--olive);padding:0;background:none;box-shadow:none}
.hhello{margin:0;font-size:var(--t-sm);color:var(--olive-d)}
.hhello b{font-weight:700}
.names{display:flex;flex-direction:column;align-items:center;gap:0;font-size:clamp(68px,20vw,96px);line-height:.9}
.names span{display:block;animation:nameIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.names .n2{font-size:.4em;line-height:1.2;animation-delay:.25s}
.names .n3{animation-delay:.45s}
@keyframes nameIn{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hdate{font-size:var(--t-xs);letter-spacing:.2em;animation:rise .8s both .7s}
.flower{width:min(240px,66vw)}
.flower.small{width:min(180px,50vw)}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sway{transform-origin:50% 30%;animation:sway 4s ease-in-out infinite}
.flower .ribbon.sway{animation:sway2 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg)}}
@keyframes sway2{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-6deg)}}
.hcounter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.hcounter div{background:rgba(255,255,255,.7);border-radius:var(--r1);padding:var(--s3) var(--s1)}
.hcounter b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;color:var(--plum);font-variant-numeric:tabular-nums}
.hcounter b.tick{animation:pop .4s}
.hcounter span{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-weight:600}
.note h3{font-size:var(--t-lg)}
.note .to{color:var(--olive)}
.note .sign{font-family:var(--f-script);font-weight:400;font-size:32px;text-align:right}
.miles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.mile{background:#fff;border-radius:var(--r1);padding:var(--s4) var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s1);box-shadow:0 10px 20px -16px rgba(74,18,36,.5)}
.mile .md{font-family:var(--f-display);font-weight:700;font-size:var(--t-lg);color:var(--plum)}
.mile b{font-size:var(--t-sm);font-weight:700;color:var(--olive-d);line-height:1.3}
.mile small{font-size:var(--t-xs)!important;color:var(--muted)}
.wcards{gap:var(--s2)}
.wcard{padding:var(--s6) var(--s2) var(--s4);border-radius:var(--r1)}
.wcard b{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:var(--t-lg);color:var(--olive)}
.wcard small{font-size:var(--t-xs)!important}
.pensei{gap:var(--s4)}
.pbtn{width:52px;height:52px}
.ptxt > b{font-size:var(--t-lg)}
.pills{gap:var(--s2)}
.pill{grid-template-columns:56px 1fr;gap:var(--s2)}
.pill .pl{min-height:56px;font-size:22px}
.pill .pr{min-height:56px;padding:var(--s2) var(--s5)}
.pill .pr b{font-size:var(--t-md)}
.pill:active .pl,.pill:active .pr{transform:scale(.98)}
.pill .pl,.pill .pr{transition:transform .2s, background .2s}
.pill:hover .pr{background:#fff7f8}
.polrow{padding:var(--s2) 0 var(--s4)}
.mini{font-size:14px}
.lastbtn{min-height:56px;width:100%}
.endband{gap:var(--s2)}
.endtitle{font-size:56px}

/* revelar ao rolar (só onde o navegador suporta; sem isso, tudo já aparece) */
@supports (animation-timeline: view()){
  .rv{animation:rvIn linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
  @keyframes rvIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
}
/* telas internas deslizam */
.view.page{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* quem está aí */
.whos{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s2)}
.whobtn{display:flex;flex-direction:column;align-items:center;gap:var(--s1);background:var(--bg);color:var(--plum);box-shadow:none;border:2px solid transparent;border-radius:var(--r2);padding:var(--s5) var(--s2) var(--s4);transition:transform .25s, border-color .25s, background .25s}
.whobtn:hover{border-color:var(--pink-2)}
.whobtn.chosen{border-color:var(--olive);background:var(--sage);transform:scale(1.04)}
.wb-ini{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-script);font-size:40px;color:#fff;background:var(--rose-fill);margin-bottom:var(--s2)}
.whobtn:last-child .wb-ini{background:linear-gradient(180deg,#a7b07e,#6f764b)}
.whobtn b{font-family:var(--f-display);font-size:var(--t-lg)}
.whobtn small{color:var(--muted)}
.wax{font-size:20px;width:60px;height:60px;margin-left:-30px;top:-30px}
.vstatus{margin-top:auto;font-size:var(--t-sm);color:var(--olive);background:var(--sage);border-radius:999px;padding:var(--s2) var(--s3)}
.vale.used .vstatus{background:var(--pink-band);color:var(--plum)}

.albumlink{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);width:100%}
.albumlink .icn{font-size:20px}
.envl .seal{font-family:var(--f-body);font-weight:700;font-size:15px}
.abedit{display:flex;flex-direction:column;gap:var(--s3);background:#fff;border-radius:var(--r2);padding:var(--s4);box-shadow:0 10px 22px -18px rgba(74,18,36,.5)}
.abitem{position:relative;background:var(--bg);border-radius:var(--r1);padding:var(--s3) var(--s4) var(--s3) 48px;text-align:left}
.abitem .abn{position:absolute;left:var(--s3);top:var(--s3);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--olive);font-size:var(--t-xs);font-weight:700}
.abitem p{margin:0 0 var(--s1);font-family:var(--f-hand);font-weight:600;font-size:19px;line-height:1.35;white-space:pre-line}
.abitem small{color:var(--muted)}
.relida{font-family:var(--f-body)!important;font-size:var(--t-sm)!important;color:var(--muted);line-height:1.4!important;margin-bottom:var(--s2)!important}
.albgrid{display:flex;flex-direction:column;gap:var(--s3)}
.albitem{background:#fff;border-radius:var(--r2);box-shadow:0 10px 22px -18px rgba(74,18,36,.5);overflow:hidden}
.albitem summary{list-style:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s4);cursor:pointer}
.albitem summary::-webkit-details-marker{display:none}
.albdate{font-size:var(--t-xs);font-weight:700;color:var(--olive);background:var(--sage);border-radius:999px;padding:var(--s1) var(--s3);white-space:nowrap}
.albitem summary b{flex:1;min-width:0;font-family:var(--f-display);font-style:italic;font-weight:600;color:var(--plum);text-align:left}
.albitem .chev{font-size:18px;color:var(--pink);transition:transform .3s}
.albitem[open] .chev{transform:rotate(45deg)}
.albitem .paper{box-shadow:none;border-radius:0;animation:unfold .6s both}
.bookwrap{display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.book{position:relative;width:min(330px,86vw);aspect-ratio:3/4.2;perspective:1600px;cursor:pointer;user-select:none;-webkit-user-select:none}
.book::before{content:"";position:absolute;inset:6px -6px -8px 6px;border-radius:6px 18px 18px 6px;background:#efe6dc;box-shadow:0 26px 40px -22px rgba(74,18,36,.55)}
.book::after{content:"";position:absolute;inset:3px -3px -4px 3px;border-radius:6px 18px 18px 6px;background:#f7efe7}
.bk-page{position:absolute;inset:0;z-index:1;transform-origin:left center;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.3,1), box-shadow .75s}
.bk-page.top{z-index:2}
.bk-page.turn{transform:rotateY(-165deg);box-shadow:-30px 0 40px -20px rgba(74,18,36,.4)}
.bk-page.noanim{transition:none}
.bk-page > div{position:absolute;inset:0;border-radius:4px 16px 16px 4px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk-paper{background:#fffdf9;padding:var(--s5) var(--s5) var(--s4) 30px;display:flex;flex-direction:column;text-align:left;
  background-image:linear-gradient(90deg, rgba(74,18,36,.12), rgba(74,18,36,0) 18px),repeating-linear-gradient(transparent 0 31px, rgba(74,18,36,.07) 31px 32px);background-position:0 0, 0 92px}
.bk-paper::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(74,18,36,.05);pointer-events:none}
.bk-page > .bk-backside{transform:rotateY(180deg);background:#f6eee6;background-image:linear-gradient(270deg, rgba(74,18,36,.14), rgba(74,18,36,0) 22px)}
.bk-head{display:flex}
.bk-cat{margin:var(--s3) 0 var(--s2);font-family:var(--f-display);font-style:italic;font-weight:600;font-size:var(--t-lg);line-height:1.3;color:var(--olive)}
.bk-lines{flex:1;min-height:0;overflow:auto}
.bk-lines p{margin:0;font-family:var(--f-hand);font-weight:600;font-size:20px;line-height:32px;color:var(--ink)}
.bk-paper .sign{margin:var(--s2) 0 0;font-size:30px}
.bk-num{margin:0;text-align:center;font-size:var(--t-xs);letter-spacing:.2em;color:var(--muted)}
.bk-cover{background:linear-gradient(135deg,#dfe6c6,#cdd8ac);display:grid;place-items:center;padding:var(--s5);
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 2px, transparent 2px 6px),linear-gradient(135deg,#dfe6c6,#c9d4a6)}
.bk-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg, rgba(86,92,56,.35), rgba(86,92,56,0))}
.bk-ribbon{position:absolute;top:0;bottom:0;right:28%;width:16px;background:#f0bac6;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.bk-ctext{position:relative;z-index:1;background:#fffdf9;border-radius:12px;padding:var(--s5) var(--s4);width:78%;text-align:center;box-shadow:0 10px 24px -14px rgba(86,92,56,.7)}
.bk-ctext::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,106,.6);border-radius:8px;pointer-events:none}
.bk-mono{margin:0;font-family:var(--f-script);font-size:30px;color:var(--pink);line-height:1}
.bk-ctext h3{margin:var(--s2) 0 var(--s1);font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px;color:var(--olive)}
.bk-sub{margin:0;font-size:var(--t-sm);color:var(--muted)}
.bk-year{margin:var(--s2) 0 0;font-family:var(--f-display);font-size:var(--t-xs);letter-spacing:.4em;color:var(--gold)}
.bk-bow{position:absolute;z-index:2;width:76px;top:6%;right:calc(28% - 30px)}
.bk-endpage{align-items:center;justify-content:center;text-align:center;gap:var(--s4);background-image:linear-gradient(90deg, rgba(74,18,36,.12), rgba(74,18,36,0) 18px)}
.bk-flower{width:44px;height:44px}
.bk-endtxt{margin:0;font-family:var(--f-hand);font-weight:600;font-size:22px;line-height:1.4;color:var(--ink);max-width:22ch}
.bknav{display:flex;align-items:center;gap:var(--s4)}
.bkbtn{width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#fff;color:var(--olive);box-shadow:0 8px 18px -12px rgba(74,18,36,.6)}
.bkbtn:disabled{opacity:.35}
.bkcount{min-width:70px;text-align:center;font-family:var(--f-display);font-style:italic;font-weight:600;color:var(--olive);font-variant-numeric:tabular-nums}
.bkhint{margin:0;font-size:var(--t-xs);color:var(--muted)}

.lastbtn{background:linear-gradient(120deg,#f0a9b9,#a9c4e0);color:#29232a}

.whobtn.chosen{border-color:var(--navy);background:var(--blue)}

.dquote::before{color:var(--navy)!important}
body{background:linear-gradient(180deg,#fdf5f7,#f2f6fb) fixed}
/* ======= mais cor e acentos vermelhos ======= */
:root{--red:#d6283b;--red-d:#a8152a;--sage:#e1ebcb;--blue:#d6e6f5;--pink-band:#f9d7dd}
.b-sage{background:#e1ebcb}
.b-blue{background:#d6e6f5}
.b-pink{background:#f9d7dd}
.b-stripes-blue{background:repeating-linear-gradient(90deg,#dce9f6 0 26px,#c9dcef 26px 52px)}

/* ---------- Sync: login com Google e tudo compartilhado entre os dois ---------- */
const hoje = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const Sync = (() => {
  let mode = 'local', fdb = null, user = null, quem = store.get('quem', '');
  let state = {planos:{}, vales:{}, pensei:{}, lidas:{}}, stateUnsub = null;
  const SL = [], cols = {};
  const online = () => mode === 'online' && !!user;
  const emitState = () => SL.forEach(f => f(state));
  const ts = () => firebase.firestore.FieldValue.serverTimestamp();
  const loadScript = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
  state = {planos:store.get('planos', {}), vales:store.get('vales', {}), pensei:store.get('pensei', {}), lidas:store.get('lidas', {})};
  async function whoAmI(){ const local = store.get('quem', ''); try{ const d = await fdb.doc('pessoas/' + user.uid).get(); quem = (d.exists && d.data().quem) || local; }catch(e){ quem = local; } if(quem && !local) store.set('quem', quem); }
  function attachAll(){
    if(!online()) return;
    if(!stateUnsub) stateUnsub = fdb.doc('compartilhado/estado').onSnapshot(d => { const v = d.data() || {}; state = {planos:v.planos || {}, vales:v.vales || {}, pensei:v.pensei || {}, lidas:v.lidas || {}}; emitState(); }, () => {});
    Object.values(cols).forEach(c => c.attach());
  }
  const ready = (async () => {
    if(!FIREBASE.apiKey) return;
    try{
      const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
      await loadScript(base + 'firebase-app-compat.js');
      await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
      firebase.initializeApp(FIREBASE); fdb = firebase.firestore(); mode = 'online';
      try{ await firebase.auth().getRedirectResult(); }catch(e){}
      await new Promise(res => { const off = firebase.auth().onAuthStateChanged(async u => { off(); user = u; if(u){ await whoAmI(); attachAll(); } res(); }); });
    }catch(e){ mode = 'local'; }
  })();
  function col(name){
    if(cols[name]) return cols[name].api;
    const c = cols[name] = {items:store.get('col_' + name, []), L:[], unsub:null};
    const emit = () => c.L.forEach(f => f(c.items));
    const saveLocal = () => { store.set('col_' + name, c.items); emit(); };
    c.attach = () => {
      if(!online() || c.unsub || !c.L.length) return;
      c.unsub = fdb.collection(name).onSnapshot(snap => {
        c.items = snap.docs.map(d => ({id:d.id, ...d.data(), criadoEm: d.data().criadoEm?.toMillis?.() ?? Date.now()})).sort((a,b) => a.criadoEm - b.criadoEm); emit();
      }, () => {});
    };
    c.api = {
      on(f){ c.L.push(f); f(c.items); ready.then(c.attach); return () => { c.L = c.L.filter(x => x !== f); }; },
      async add(o){ await ready; if(online()) return fdb.collection(name).add({...o, uid:user.uid, criadoEm:ts()});
        c.items = [...c.items, {...o, id:'l' + Date.now() + Math.random().toString(36).slice(2,6), criadoEm:Date.now()}]; saveLocal(); },
      async set(id, o){ await ready; if(online()) return fdb.collection(name).doc(id).set({...o, uid:user.uid, criadoEm:ts()}, {merge:true});
        c.items = [...c.items.filter(x => x.id !== id), {...o, id, criadoEm:Date.now()}]; saveLocal(); },
      async remove(id){ await ready; if(online()) return fdb.collection(name).doc(id).delete();
        c.items = c.items.filter(x => x.id !== id); saveLocal(); }
    };
    return c.api;
  }
  return {
    ready, col,
    get mode(){ return mode; }, get user(){ return user; }, get quem(){ return quem; }, get online(){ return online(); },
    async login(){
      await ready; if(mode !== 'online') return 'offline';
      const prov = new firebase.auth.GoogleAuthProvider();
      try{ user = (await firebase.auth().signInWithPopup(prov)).user; }
      catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)){ await firebase.auth().signInWithRedirect(prov); return 'redirect'; }
        throw e;
      }
      await whoAmI(); attachAll(); return 'ok';
    },
    async setQuem(q){
      quem = q; store.set('quem', q);
      if(online()) await fdb.doc('pessoas/' + user.uid).set({quem:q, email:user.email || ''}, {merge:true});
    },
    on(k, f){ if(k === 'cartas') return col('cartasFilhos').on(f); SL.push(f); f(state); return () => { const i = SL.indexOf(f); if(i > -1) SL.splice(i, 1); }; },
    async setFlag(group, key, val){
      await ready;
      if(online()) return fdb.doc('compartilhado/estado').set({[group]:{[key]:val}}, {merge:true});
      state = {...state, [group]:{...state[group], [key]:val}}; store.set(group, state[group]); emitState();
    },
    async pensei(){
      await ready; const d = hoje(), q = quem || 'Di';
      if(online()) return fdb.doc('compartilhado/estado').set({pensei:{[d]:{[q]:firebase.firestore.FieldValue.increment(1)}}}, {merge:true});
      const day = {...(state.pensei[d] || {})}; day[q] = (day[q] || 0) + 1;
      state = {...state, pensei:{...state.pensei, [d]:day}}; store.set('pensei', state.pensei); emitState();
    },
    addCarta(c){ return col('cartasFilhos').add(c); },
    removeCarta(id){ return col('cartasFilhos').remove(id); }
  };
})();

function renderStep(i){

      </form>`}
    </div></div>`;
  const card = document.getElementById('card'), msg = document.getElementById('msg');
  const fail = () => { msg.textContent = s.wrong[wrong++ % s.wrong.length]; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  const pass = el => { sparkle(el); setTimeout(() => i+1 < steps.length ? renderStep(i+1) : renderSuccess(), 450); };
  if(s.type === 'date'){
    let dig = '';
    const paint = () => document.querySelectorAll('#hearts svg').forEach((h,k) => h.classList.toggle('on', k < dig.length));

      if(k === '⌫'){ dig = dig.slice(0,-1); paint(); return; }
      if(dig.length >= 8) return;
      dig += k; paint(); msg.textContent = '';
      if(dig.length === 8){
        const v = dig.slice(0,2) + '/' + dig.slice(2,4) + '/' + dig.slice(4);
        setTimeout(() => { if(s.check(v)) pass(document.getElementById('hearts')); else { fail(); dig = ''; setTimeout(paint, 300); } }, 250);
      }
    };
    card.querySelectorAll('.key[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    const onKey = e => { if(!document.getElementById('hearts')){ removeEventListener('keydown', onKey); return; } if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('⌫'); };
    addEventListener('keydown', onKey);
    return;
  }
  const input = document.getElementById('ans');
  setTimeout(() => input.focus(), 500);
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    if(s.check(input.value)) pass(input); else { fail(); input.select(); }
  });
}

    spawn -= dt;
    if(spawn <= 0){
      let bad = Math.random() < .14 + lvl * .14;
      if(!bad && !pool.length) bad = true;
      const it = {x:0, y:-30, v:(.11+Math.random()*.06)*speed, bad, w:Math.random()*6};
      if(!bad){ it.word = pool.shift(); x.font = FONT; it.r = Math.max(28, x.measureText(splitWord(it.word)[1]).width * .62 + 10); }
      else it.r = 18;
      it.x = it.r + 8 + Math.random()*(W - 2*it.r - 16);
      items.push(it);
      spawn = every * (.7 + Math.random()*.6);
    }
    let sx = 0; if(shakeT > 0){ shakeT -= dt; sx = (Math.random()-.5)*8; }
    x.clearRect(0,0,W,H); x.save(); x.translate(sx, 0);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    drawCatcher(px, H-30);
    for(const it of items){
      it.y += it.v*dt; it.w += dt*.004;
      const ix = it.x + Math.sin(it.w)*5;
      if(it.bad) drawBroken(ix, it.y, it.r); else drawHeart(ix, it.y, it.r, it.word);
      const reach = 26 + it.r*.6;
      if(!it.hit && it.y + it.r*.6 > H-62 && it.y - it.r*.6 < H-12 && Math.abs(ix - px) < reach){
        it.hit = true;
        if(it.bad){ x.restore(); end(false, 'Pegou um coração partido.'); return; }
        caught.push(it.word); pops.push({x:ix, y:it.y, t:0, txt:'+ ' + it.word, c:'#c93a52'}); hud();
        if(caught.length >= META){ x.restore(); end(true); return; }
      }
      if(!it.hit && it.y - it.r > H){
        it.hit = true;
        if(!it.bad){ pool.push(it.word); lives--; shakeT = 250; pops.push({x:ix, y:H-24, t:0, txt:'−1 ♥︎', c:'#8e1730'}); hud();
          if(lives <= 0){ x.restore(); end(false, 'Deixou cair 5 corações.'); return; } }
      }
    }
    for(const p of pops){ p.t += dt; x.globalAlpha = Math.max(0, 1 - p.t/700); x.font = '600 16px Jost, system-ui'; x.fillStyle = p.c; x.fillText(p.txt, p.x, p.y - p.t*.06); }
    x.globalAlpha = 1; x.fillStyle = '#000'; pops = pops.filter(p => p.t < 700);
    items = items.filter(it => !it.hit);
    x.restore();
    gameRAF = requestAnimationFrame(loop);
  }
};

/* ---------- envelopes (cartas pro futuro) ---------- */
function envelopes(list, seal){
  const now = new Date(), fmt = d => d.toLocaleDateString('pt-BR');
  return `<div class="envlist">${list.map((c,k)=>{
    const locked = c.abre && c.abre > now;
    const sub = c.quando ? c.quando : locked ? `abre em ${fmt(c.abre)} · faltam ${Math.ceil((c.abre-now)/86400000)} dias` : c.abre ? 'já pode abrir' : 'abre quando você precisar';
    return `<button class="envl st ${locked?'locked':''}" style="--i:${k}" data-k="${k}" aria-label="${esc(c.titulo)}">
      <span class="eb"></span><span class="ep"></span><span class="ef"></span><span class="efl"></span>
      <span class="seal">${locked ? icon('lock') : seal}</span>
      <span class="label">${esc(c.titulo)}<small>${esc(sub)}</small></span></button>
      <div class="slot" id="slot${k}"></div>`;
  }).join('')}</div>`;
}
function wireEnvelopes(list, opener){
  app.querySelectorAll('.envl').forEach(b => b.onclick = () => {
    if(b.classList.contains('locked')){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    const k = +b.dataset.k, slot = document.getElementById('slot'+k);
    if(b.classList.contains('open')){ b.classList.remove('open'); slot.innerHTML = ''; return; }
    b.classList.add('open');
    setTimeout(()=>{ const r = b.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/3, 18); }, 450);
    setTimeout(()=>{ slot.innerHTML = opener(list[k]); slot.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 1000);
  });
}

/* ---------- abra quando ---------- */
/* cada envelope guarda várias cartas; a cada abertura sai uma que ele ainda não leu */
function abraPool(list, cat){
  const real = list.filter(c => c.cat === cat.id).sort((a,b) => a.criadoEm - b.criadoEm);
  return real.length ? real : [{id:'ex_' + cat.id, cat:cat.id, texto:cat.texto, exemplo:true, criadoEm:0}];
}
VIEWS.abra = () => {
  const souEla = Sync.quem === 'Mihzinha';
  shell('pra cada momento','Abra quando…', souEla ? 'Escreva quantas cartas quiser em cada envelope. Cada vez que ele abrir, sai uma diferente' : 'Escolhe o envelope do jeito que você estiver se sentindo. Cada vez sai uma carta nova',
    `<div class="envlist" id="abl"></div>
     <button class="ghost albumlink" id="toalbum">${icon('cards')}Ver o álbum de cartas</button>`);
  document.getElementById('toalbum').onclick = () => VIEWS.album();
  const col = Sync.col('abraQuando');
  let list = [], lidas = {};
  const openFor = {};
  function draw(){
    const box = document.getElementById('abl'); if(!box) return;
    box.innerHTML = C.abraQuando.map((cat,k) => {
      const pool = abraPool(list, cat), novas = pool.filter(c => !lidas[c.id]).length;
      const sub = souEla ? `${list.filter(c => c.cat === cat.id).length} escritas · ${pool.filter(c => lidas[c.id] && !c.exemplo).length} lidas` : (novas ? `${novas} ${novas === 1 ? 'carta nova' : 'cartas novas'}` : 'você já leu todas');
      return `<button class="envl ${!souEla && openFor[cat.id] ? 'open' : ''}" data-c="${cat.id}" aria-label="${esc(cat.titulo)}">
        <span class="eb"></span><span class="ep"></span><span class="ef"></span><span class="efl"></span>
        <span class="seal">${souEla ? icon('plus') : (novas ? novas : '♥︎')}</span>
        <span class="label">${esc(cat.titulo)}<small>${sub}</small></span></button>
        <div class="slot" id="slot-${cat.id}">${openFor[cat.id] === 'EDIT' ? editHtml(cat.id) : (openFor[cat.id] || '')}</div>`;
    }).join('');
    box.querySelectorAll('.envl').forEach(b => b.onclick = () => souEla ? editCat(b.dataset.c) : readCat(b, b.dataset.c));
    box.querySelectorAll('[data-del]').forEach(d => d.onclick = () => { if(d.dataset.sure) col.remove(d.dataset.del); else { d.dataset.sure = 1; d.textContent = 'toca de novo'; } });
    box.querySelectorAll('form[data-cat]').forEach(f => f.onsubmit = async e => {
      e.preventDefault(); const ta = f.querySelector('textarea'), t = ta.value.trim(), err = f.querySelector('.werr');
      if(!t){ err.textContent = 'Escreve a carta antes de guardar.'; return; }
      const btn = f.querySelector('button'); btn.disabled = true;
      try{ await col.add({cat:f.dataset.cat, texto:t, autor:Sync.quem}); sparkle(btn); }
      catch(x){ err.textContent = 'Não deu pra guardar. Tenta de novo.'; btn.disabled = false; }
    });
  }
  function editHtml(id){
    const cat = C.abraQuando.find(c => c.id === id), mine = list.filter(c => c.cat === id);
    return `<div class="abedit">
      <form class="write" data-cat="${id}"><textarea rows="5" placeholder="Escreve uma carta pra quando ele ${esc(cat.titulo.replace('Abra quando ',''))}…" aria-label="Nova carta"></textarea><button type="submit">Guardar carta</button><p class="werr"></p></form>
      ${mine.length ? mine.map((c,i) => `<div class="abitem"><span class="abn">${i+1}</span><p>${esc(c.texto)}</p><small>${lidas[c.id] ? 'ele já leu' : 'ainda não lida'} · <button class="linkbtn" data-del="${c.id}">apagar</button></small></div>`).join('') : `<p class="lead">Nenhuma carta escrita ainda nesse envelope.</p>`}
    </div>`;
  }
  function editCat(id){
    if(openFor[id]){ delete openFor[id]; return draw(); }
    openFor[id] = 'EDIT'; draw();
  }
  function readCat(btn, id){
    const cat = C.abraQuando.find(c => c.id === id), pool = abraPool(list, cat);
    if(openFor[id]){ delete openFor[id]; return draw(); }
    let carta = pool.find(c => !lidas[c.id]), repetida = false;
    if(!carta){ carta = pool[Math.floor(Math.random() * pool.length)]; repetida = true; }
    btn.classList.add('open');
    setTimeout(() => { const r = btn.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/3, 18); }, 450);
    setTimeout(() => {
      openFor[id] = `<div class="paper unfold">${repetida ? '<p class="relida">você já leu todas desse envelope, então essa é uma de novo ♥︎</p>' : ''}<p class="to">${esc(cat.titulo)}</p>${esc(carta.texto).split(/\n+/).map(t => `<p>${t}</p>`).join('')}<p class="sign">Mihzinha</p></div>`;
      if(!lidas[carta.id]) Sync.setFlag('lidas', carta.id, {em:Date.now(), cat:id});
      draw(); document.getElementById('slot-' + id)?.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 1000);
  }
  const offA = col.on(l => { list = l; draw(); });
  const offS = Sync.on('state', st => { lidas = st.lidas || {}; draw(); });
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { offA(); offS(); prev(); };
};

  function build(){
    const todas = C.abraQuando.flatMap(cat => abraPool(list, cat).map(c => ({...c, cat})));

    const c = pg.c;
    return `<div class="bk-paper">
        <div class="bk-head"><span class="albdate">${fmt(lidas[c.id].em)}</span></div>
        <p class="bk-cat">${esc(c.cat.titulo)}</p>
        <div class="bk-lines">${esc(c.texto).split(/\n+/).map(t => `<p>${t}</p>`).join('')}</div>
        <p class="sign">Mihzinha</p>
        <p class="bk-num">${pg.i} de ${pg.total}</p></div>`;
  }
  function render(){
    const book = document.getElementById('book'); if(!book) return;
    book.innerHTML = `<div class="bk-page under">${pageHtml(pages[cur + 1])}</div><div class="bk-page top" id="bktop">${pageHtml(pages[cur])}<div class="bk-backside"></div></div>`;
    document.getElementById('bkcount').textContent = cur === 0 ? 'capa' : cur === pages.length - 1 ? 'fim' : `${cur} / ${pages.length - 2}`;
    document.getElementById('bkprev').disabled = cur === 0;
    document.getElementById('bknext').disabled = cur >= pages.length - 1;
  }
  function next(){
    if(busy || cur >= pages.length - 1) return; busy = true;
    const top = document.getElementById('bktop'); top.classList.add('turn');
    setTimeout(() => { cur++; busy = false; render(); }, reduce ? 0 : 750);
  }
  function prev(){
    if(busy || cur <= 0) return; busy = true;
    const book = document.getElementById('book');
    book.innerHTML = `<div class="bk-page under">${pageHtml(pages[cur])}</div><div class="bk-page top turn noanim" id="bktop">${pageHtml(pages[cur - 1])}<div class="bk-backside"></div></div>`;
    const top = document.getElementById('bktop'); void top.offsetWidth; top.classList.remove('noanim'); top.classList.remove('turn');
    setTimeout(() => { cur--; busy = false; render(); }, reduce ? 0 : 750);
  }
  document.getElementById('bknext').onclick = next;
  document.getElementById('bkprev').onclick = prev;
  const book = document.getElementById('book');
  book.onclick = e => { const r = book.getBoundingClientRect(); (e.clientX - r.left > r.width * .4) ? next() : prev(); };
  let sx = null;

  book.addEventListener('touchend', e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if(Math.abs(dx) > 40){ dx < 0 ? next() : prev(); } });
  const onKey = e => { if(!document.getElementById('book')){ removeEventListener('keydown', onKey); return; } if(e.key === 'ArrowRight') next(); if(e.key === 'ArrowLeft') prev(); };
  addEventListener('keydown', onKey);
  const offA = col.on(l => { list = l; build(); if(!busy) render(); });
  const offS = Sync.on('state', st => { lidas = st.lidas || {}; build(); if(!busy) render(); });
  const back = document.getElementById('back'), prv = back.onclick; back.onclick = () => { offA(); offS(); prv(); };
};

/* ---------- roleta do date ---------- */
VIEWS.roleta = () => {
  const eu = Sync.quem || 'Di';
  shell('próximo encontro','Roleta do date','Gira e o destino escolhe o nosso próximo programa',
    `<div class="wheelbox"><div class="pointer" aria-hidden="true"></div><canvas id="wh" aria-label="Roleta"></canvas><button class="spin" id="spin">Girar</button></div>
     <div id="wres" aria-live="polite"></div>
     <details class="wopts"><summary>Opções da roleta</summary>
       <form class="addopt" id="of"><input type="text" id="ot" placeholder="Adicionar uma ideia de date" aria-label="Nova opção"><button type="submit" aria-label="Adicionar">${icon('plus')}</button></form>
       <ul id="ol"></ul></details>`);
  const cv = document.getElementById('wh'), x = cv.getContext('2d'), col = Sync.col('roleta');
  let opts = [], extra = [], ang = 0, spinning = false;
  const COLS = ['#e48aa3','#8a9160','#fbe6ea','#eaf0dc'];
  function draw(){
    const S = cv.clientWidth, d = devicePixelRatio; if(!S) return; cv.width = cv.height = S*d; x.setTransform(d,0,0,d,0,0);
    const r = S/2, n = opts.length, seg = Math.PI*2/n;
    x.clearRect(0,0,S,S); x.save(); x.translate(r,r); x.rotate(ang);
    opts.forEach((o,i) => {
      x.beginPath(); x.moveTo(0,0); x.arc(0,0,r-4,i*seg,(i+1)*seg); x.closePath(); x.fillStyle = COLS[i % (n % 4 === 1 ? 3 : 4)]; x.fill();
      x.strokeStyle = '#fffaf9'; x.lineWidth = 2; x.stroke();
      x.save(); x.rotate(i*seg + seg/2); x.textAlign = 'right'; x.textBaseline = 'middle';
      x.fillStyle = (i % 4) < 2 ? '#fff' : '#4a1224'; x.font = `600 ${n > 12 ? 10 : 12}px Jost, system-ui`;
      const t = o.length > 22 ? o.slice(0,21) + '…' : o; x.fillText(t, r - 16, 0); x.restore();
    });
    x.restore();
    x.beginPath(); x.arc(r,r,26,0,Math.PI*2); x.fillStyle = '#fffaf9'; x.fill();
  }
  const rebuild = () => {
    opts = [...C.dates, ...extra.map(e => e.texto)]; draw();
    document.getElementById('ol').innerHTML = C.dates.map(t => `<li>${esc(t)}</li>`).join('') + extra.map(e => `<li>${esc(e.texto)} <button class="linkbtn" data-del="${e.id}">tirar</button></li>`).join('');
    document.querySelectorAll('#ol [data-del]').forEach(b => b.onclick = () => col.remove(b.dataset.del));
  };
  const off = col.on(list => { if(!document.getElementById('wh')) return; extra = list; rebuild(); });
  addEventListener('resize', draw);
  document.getElementById('of').onsubmit = async e => { e.preventDefault(); const i = document.getElementById('ot'), t = i.value.trim(); if(!t) return; await col.add({texto:t, autor:eu}); i.value = ''; };
  document.getElementById('spin').onclick = () => {
    if(spinning) return; spinning = true; document.getElementById('wres').innerHTML = '';
    const n = opts.length, seg = Math.PI*2/n, pick = Math.floor(Math.random()*n);
    // ponteiro no topo (-90°): o centro do segmento escolhido para lá
    const target = -Math.PI/2 - (pick*seg + seg/2);
    const TAU = Math.PI*2, start = ang, delta = ((target - start) % TAU + TAU) % TAU, end = start + TAU*6 + delta;
    const total = end - start, dur = reduce ? 10 : 4200, t0 = performance.now();
    (function step(t){
      const p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1 - p, 4);
      ang = start + total*e; draw();
      if(p < 1) return requestAnimationFrame(step);
      spinning = false; const r = document.getElementById('spin').getBoundingClientRect(); burst(r.left + r.width/2, r.top, 40);
      const txt = `Mihzinha, a roleta escolheu o nosso próximo date: ${opts[pick]}! Quando a gente vai? ♥`;
      document.getElementById('wres').innerHTML = `<div class="qcard center page"><p class="eyebrow">nosso próximo date</p><h3>${esc(opts[pick])}</h3>
        ${eu === 'Mihzinha' ? '' : `<a class="wlink" href="https://wa.me/${C.whatsMihzinha}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${icon('whats')}Combinar com a Mihzinha</a>`}</div>`;
    })(t0);
  };
  const back = document.getElementById('back'), prev = back.onclick; back.onclick = () => { off(); removeEventListener('resize', draw); prev(); };
};

/* ---------- pétalas caindo + explosões ---------- */
const pc = document.getElementById('petals'), pctx = pc.getContext('2d');
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const DPR = devicePixelRatio; let PW, PH;
function size(){ PW = pc.width = fx.width = innerWidth*DPR; PH = pc.height = fx.height = innerHeight*DPR; }
size(); addEventListener('resize', size);
const PCOL = ['#b3122c','#d9b3ab','#7a1424','#e7cfc7'];
const petals = Array.from({length:14}, (_,i) => ({x:Math.random(), y:Math.random(), s:Math.random()*.0009+.0004, r:Math.random()*7+6, a:Math.random()*6, va:(Math.random()-.5)*.03, w:Math.random()*7, c:PCOL[i%4], o:Math.random()*.35+.35}));
function petal(c, r){ c.beginPath(); c.moveTo(0,-r); c.bezierCurveTo(r*.9,-r*.6, r*.7,r*.7, 0,r); c.bezierCurveTo(-r*.7,r*.7, -r*.9,-r*.6, 0,-r); c.fill(); }
function heart(c, r){
  c.beginPath(); c.moveTo(0,r*.3);
  c.bezierCurveTo(0,-r*.3,-r,-r*.3,-r,r*.25); c.bezierCurveTo(-r,r*.75,0,r*1.05,0,r*1.4);
  c.bezierCurveTo(0,r*1.05,r,r*.75,r,r*.25); c.bezierCurveTo(r,-r*.3,0,-r*.3,0,r*.3); c.fill();
}
let parts = [];
function burst(x, y, n=40){
  if(reduce) return;
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = Math.random()*6+2;
    parts.push({x:x*DPR, y:y*DPR, vx:Math.cos(a)*v*DPR, vy:(Math.sin(a)*v-3)*DPR, life:1, r:(Math.random()*6+5)*DPR, c:PCOL[i%4], rot:Math.random()*6, heart:Math.random()<.6}); }
}
function sparkle(el){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 14); }
function frame(){
  pctx.clearRect(0,0,PW,PH);
  if(!document.getElementById('xapp')) for(const p of petals){
    p.y += p.s * .7; p.w += .01; if(p.y > 1.05){ p.y = -.05; p.x = Math.random(); }
    pctx.save(); pctx.globalAlpha = .18 + p.o * .35; pctx.fillStyle = p.c;
    pctx.translate((p.x + Math.sin(p.w)*.015)*PW, p.y*PH); heart(pctx, (p.r * .42 + 2) * DPR); pctx.restore();
  }
  fctx.clearRect(0,0,PW,PH);
  parts = parts.filter(p => p.life > 0);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .25*DPR; p.vx *= .98; p.life -= .016; p.rot += .08;
    fctx.save(); fctx.globalAlpha = Math.max(0,p.life); fctx.fillStyle = p.c; fctx.translate(p.x, p.y); fctx.rotate(p.heart ? 0 : p.rot);
    p.heart ? heart(fctx, p.r*.8) : petal(fctx, p.r); fctx.restore();
  }
  if(!reduce) requestAnimationFrame(frame);
}
frame();

/* ---------- neve só no cartão de Natal ---------- */
let snowRAF;
function heroSnow(){
  cancelAnimationFrame(snowRAF);
  const c = document.getElementById('xsnow'); if(!c) return;
  const x = c.getContext('2d');
  const fit = () => { c.width = c.clientWidth*DPR; c.height = c.clientHeight*DPR; }; fit();
  const fl = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*2+.6, s:Math.random()*.0018+.0007, w:Math.random()*7}));
  (function loop(){
    if(!document.getElementById('xsnow')) return;
    if(c.width !== c.clientWidth*DPR) fit();
    x.clearRect(0,0,c.width,c.height); x.fillStyle = 'rgba(247,239,228,.85)';
    for(const f of fl){ f.y += f.s; f.w += .01; if(f.y > 1.02){ f.y = -.02; f.x = Math.random(); }
      x.beginPath(); x.arc((f.x + Math.sin(f.w)*.01)*c.width, f.y*c.height, f.r*DPR, 0, 7); x.fill(); }
    if(!reduce) snowRAF = requestAnimationFrame(loop);
  })();
}
